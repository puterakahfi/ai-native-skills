name: Apply work-item deduplication improvement

on:
  push:
    branches:
      - feat/132-work-item-deduplication
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/132-work-item-deduplication
          fetch-depth: 0

      - name: Refine skill and eval assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected anchor not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          skill = "skills/delivery-work-breakdown/SKILL.md"
          tests = "contracts/tests/delivery-work-breakdown.test.yaml"

          replace_once(
              skill,
              "verified delivery scope\n→ release-unit classification",
              "verified delivery scope\n→ canonical work-item identity decision\n→ release-unit classification",
          )

          replace_once(
              skill,
              "An empty result from one query is never sufficient evidence for `NEW`.\n\n## Phase 1",
              '''An empty result from one query is never sufficient evidence for `NEW`.\n\nLocal quality gates for the issue-plan boundary:\n\n```text\nwork_item_identity_is_explicit_before_issue_plan_execution\nmulti_query_duplicate_search_covers_identity_entities_symptoms_synonyms_and_parent_refs\nopen_and_closed_tracker_state_is_considered_when_relevant\ncandidate_matches_are_inspected_by_scope_and_acceptance_not_title_only\nempty_single_query_result_does_not_prove_uniqueness\nexisting_canonical_owner_is_reused_or_extended_instead_of_duplicated\nscope_split_is_explicit_when_related_work_is_not_fully_duplicate\naccidental_duplicate_recovery_transfers_unique_evidence_and_preserves_provenance\nduplicate_search_limitations_are_disclosed_as_not_verified\n```\n\n## Phase 1''',
          )

          replace_once(
              tests,
              '''    must_contain:\n    - EXISTING_OWNER\n    - OVERLAP_REQUIRES_SCOPE_SPLIT\n    - scope boundary''',
              '''    must_contain:\n    - OVERLAP_REQUIRES_SCOPE_SPLIT\n    - existing owner covers related migration scope\n    - uncovered self-repository scope\n    - scope boundary''',
          )

          replace_once(
              tests,
              '''    must_contain:\n    - NEW\n    - OVERLAP_REQUIRES_SCOPE_SPLIT\n    - repository or pull-request topology''',
              '''    must_contain:\n    - NEW\n    - related but separate scope\n    - repository or pull-request topology''',
          )
          PY

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/delivery-work-breakdown/SKILL.md contracts/tests/delivery-work-breakdown.test.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "test(delivery): make work-item identity verdicts deterministic (#132)"
          git push origin HEAD:feat/132-work-item-deduplication
