name: Bootstrap Product Image Validation

on:
  pull_request:
    branches:
      - 140-commercial-creative-production-spec
    paths:
      - "validation/product-image-production/bootstrap/payload.part*"
      - ".github/workflows/bootstrap-product-image-validation.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record normalized chunk diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bootstrap = Path("validation/product-image-production/bootstrap")
          chunk_names = [
              "payload.part01",
              "payload.part02",
              "payload.part03",
              "payload.part04",
              "payload.part05a",
              "payload.part05b",
          ]
          diagnostics = {}
          joined = ""
          for name in chunk_names:
              normalized = "".join((bootstrap / name).read_text(encoding="utf-8").split())
              joined += normalized
              diagnostics[name] = {
                  "length": len(normalized),
                  "sha256": hashlib.sha256(normalized.encode("ascii")).hexdigest(),
              }
          diagnostics["joined"] = {
              "length": len(joined),
              "sha256": hashlib.sha256(joined.encode("ascii")).hexdigest(),
          }
          output = bootstrap / "diagnostics.json"
          output.write_text(json.dumps(diagnostics, indent=2) + "\n", encoding="utf-8")
          PY

          git add validation/product-image-production/bootstrap/diagnostics.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(validation): record bootstrap diagnostics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
