name: Cleanup Product Image Validation Bootstrap

on:
  pull_request:
    branches:
      - 140-commercial-creative-production-spec
    paths:
      - ".github/workflows/bootstrap-product-image-validation.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove temporary bootstrap payloads
        shell: bash
        run: |
          set -euo pipefail
          git rm -r validation/product-image-production/bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(validation): remove bootstrap payloads"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
