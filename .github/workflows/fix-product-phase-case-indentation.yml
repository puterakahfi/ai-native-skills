name: Fix product phase case indentation
on:
  push:
    branches: [feat/239-product-phase-compositions-clean]
    paths:
      - scripts/fix_product_phase_case_indentation.py
      - .github/workflows/fix-product-phase-case-indentation.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/239-product-phase-compositions-clean
      - run: python3 scripts/fix_product_phase_case_indentation.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(product): nest composition cases under workflow contract'
          git push
