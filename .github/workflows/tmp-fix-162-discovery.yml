name: Temporary Fix 162 Discovery

on:
  push:
    branches:
      - feat/162-unit-integration-testing
    paths:
      - .github/workflows/tmp-fix-162-discovery.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize integration testing facets
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('catalog/capability-discovery/classifications.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          group = next(item for item in data['classification_groups'] if item['id'] == 'engineering-quality')
          group['overrides']['integration-testing']['concerns'] = ['implementation', 'testing', 'reliability']
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')
      - name: Commit correction
        run: |
          git add catalog/capability-discovery/classifications.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(discovery): use valid integration testing facets'
          git push origin HEAD:${GITHUB_REF_NAME}
