name: Validate capability inventory

on:
  pull_request:
    branches: [main]
    paths:
      - skills/**
      - README.md
      - docs/skills.md
      - docs/capability-inventory.json
      - docs/contract-coverage-discovery.yaml
      - catalog/capability-discovery/**
      - .github/workflows/validate-capability-inventory.yml

permissions:
  contents: write

jobs:
  inventory-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Capture validator output
        shell: bash
        run: |
          set +e
          python3 scripts/verify-capability-inventory.py > inventory-diagnostic.txt 2>&1
          echo "inventory_status=$?" >> inventory-diagnostic.txt
          python3 scripts/verify-capability-discovery.py >> inventory-diagnostic.txt 2>&1
          echo "discovery_status=$?" >> inventory-diagnostic.txt
          set -e
      - name: Commit diagnostic
        shell: bash
        run: |
          git add inventory-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(debug): capture inventory diagnostics"
          git push origin "HEAD:${{ github.head_ref }}"
