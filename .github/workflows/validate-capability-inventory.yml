name: Validate capability inventory

on:
  pull_request:
    branches: [main]
    paths:
      - skills/**
      - README.md
      - docs/skills.md
      - docs/capability-inventory.json
      - docs/contract-coverage-discovery.yaml
      - catalog/capability-discovery/**
      - .github/workflows/validate-capability-inventory.yml

permissions:
  contents: write

jobs:
  inventory-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Synchronize discovery and generated evidence
        shell: python
        run: |
          import json
          import re
          from pathlib import Path
          p = Path("catalog/capability-discovery/classifications.json")
          data = json.loads(p.read_text())
          group = next(x for x in data["classification_groups"] if x["id"] == "workflows")
          if "software-testing-workflow" not in group["capabilities"]:
              group["capabilities"].append("software-testing-workflow")
          group["capabilities"].sort()
          group.setdefault("overrides", {})["software-testing-workflow"] = {
              "domains": ["engineering", "quality"],
              "lifecycle_stages": ["plan", "build", "verify", "release"],
              "concerns": ["workflow-routing", "testing", "review", "governance"],
              "ecosystems": ["technology-agnostic"],
          }
          p.write_text(json.dumps(data, separators=(",", ":")) + "\n")
          for filename in ("README.md", "docs/skills.md"):
              path = Path(filename)
              text = path.read_text()
              text = text.replace("98 skills · 11 workflows · 7 meta-skills", "98 skills · 12 workflows · 7 meta-skills")
              text = re.sub(r"^- `workflow`: 11$", "- `workflow`: 12", text, flags=re.MULTILINE)
              text = re.sub(r"^- Total executable skills: 116$", "- Total executable skills: 117", text, flags=re.MULTILINE)
              path.write_text(text)
      - run: python scripts/verify-capability-inventory.py --write-snapshot || true
      - name: Regenerate coverage snapshot
        run: python scripts/inventory-contract-coverage.py --root . --core-root .deps/ai-native-core || true
      - name: Commit generated metadata
        shell: bash
        run: |
          git add README.md docs/skills.md catalog/capability-discovery/classifications.json docs/capability-inventory.json docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metadata): sync software testing workflow evidence"
          git push origin "HEAD:${{ github.head_ref }}"
