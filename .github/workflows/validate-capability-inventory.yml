name: Validate capability inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - skills/**/SKILL.md
      - README.md
      - docs/skills.md
      - docs/capability-inventory.json
      - docs/capability-discovery.md
      - catalog/capability-discovery/**
      - scripts/verify-capability-inventory.py
      - scripts/verify-capability-discovery.py
      - .github/workflows/validate-capability-inventory.yml

permissions:
  contents: write

jobs:
  inventory-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Generate canonical inventory snapshot
        run: python3 scripts/verify-capability-inventory.py --write-snapshot
      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- docs/capability-inventory.json; then
            echo 'Capability inventory already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/capability-inventory.json
          git commit -m 'chore(inventory): sync capability inventory snapshot'
          git push origin HEAD:${{ github.head_ref }}
