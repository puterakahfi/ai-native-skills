name: Validate capability inventory

on:
  pull_request:
    branches: [main]
    paths:
      - skills/**
      - README.md
      - docs/skills.md
      - docs/capability-inventory.json
      - docs/contract-coverage-discovery.yaml
      - catalog/capability-discovery/**
      - .github/workflows/validate-capability-inventory.yml

permissions:
  contents: write

jobs:
  inventory-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - id: core-ref
        shell: bash
        run: |
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Synchronize inventory counts and discovery
        shell: python
        run: |
          import importlib.util
          import json
          import re
          from pathlib import Path
          script = Path("scripts/verify-capability-inventory.py")
          spec = importlib.util.spec_from_file_location("inventory", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          counts = module.derive_inventory()["counts"]
          readme = Path("README.md")
          text = readme.read_text()
          text, replaced = re.subn(
              r"\*\*\d+ skills · \d+ workflows · \d+ meta-skills\*\*",
              f"**{counts['skill']} skills · {counts['workflow']} workflows · {counts['meta-skill']} meta-skills**",
              text,
              count=1,
          )
          assert replaced == 1
          readme.write_text(text)
          taxonomy = Path("docs/skills.md")
          text = taxonomy.read_text()
          replacements = {
              r"^- `skill`: \d+$": f"- `skill`: {counts['skill']}",
              r"^- `workflow`: \d+$": f"- `workflow`: {counts['workflow']}",
              r"^- `meta-skill`: \d+$": f"- `meta-skill`: {counts['meta-skill']}",
              r"^- Total executable skills: \d+$": f"- Total executable skills: {counts['total']}",
          }
          for pattern, replacement in replacements.items():
              text, replaced = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              assert replaced == 1
          taxonomy.write_text(text)
          path = Path("catalog/capability-discovery/classifications.json")
          data = json.loads(path.read_text())
          group = next(x for x in data["classification_groups"] if x["id"] == "workflows")
          if "software-testing-workflow" not in group["capabilities"]:
              group["capabilities"].append("software-testing-workflow")
          group["capabilities"].sort()
          group.setdefault("overrides", {})["software-testing-workflow"] = {
              "domains": ["engineering", "quality"],
              "lifecycle_stages": ["plan", "build", "verify", "release"],
              "concerns": ["workflow-routing", "testing", "review", "governance"],
              "ecosystems": ["technology-agnostic"],
          }
          path.write_text(json.dumps(data, separators=(",", ":")) + "\n")
      - run: python scripts/verify-capability-inventory.py --write-snapshot || true
      - run: python scripts/inventory-contract-coverage.py --root . --core-root .deps/ai-native-core || true
      - name: Commit generated metadata
        shell: bash
        run: |
          git add README.md docs/skills.md catalog/capability-discovery/classifications.json docs/capability-inventory.json docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metadata): sync software testing workflow evidence"
          git push origin "HEAD:${{ github.head_ref }}"
