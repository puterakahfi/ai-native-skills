name: Patch issue 135 trigger grounding

on:
  push:
    branches:
      - feat/135-trigger-assertion-grounding
    paths:
      - .github/workflows/patch-135-trigger-grounding.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/135-trigger-assertion-grounding
          fetch-depth: 0

      - name: Apply skill and regression changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing anchor in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          skill = "skills/skill-eval/SKILL.md"
          tests = "contracts/tests/skill-eval.test.yaml"

          replace_once(
              skill,
              "  ai-native-skills.version: 1.1.1",
              "  ai-native-skills.version: 1.1.2",
          )

          grounding_section = '''- Test version matches `metadata["ai-native-skills.version"]` in the governing `SKILL.md`.
- Classify every assertion as behavioral, structural, or factual before treating it as a valid expectation.
- Every factual assertion and expected verdict must be supported by the trigger or explicitly attributable context.
- Uncertain trigger wording cannot force a certain factual conclusion.

## Trigger-Assertion Grounding Review

Run this review before scoring model behavior or patching the target skill.

For each regression case:

```text
1. classify each assertion as behavioral, structural, or factual
2. map every factual assertion to exact trigger or context evidence
3. verify the expected verdict has enough decision facts
4. preserve uncertainty when the trigger leaves a material fact unknown
5. classify unsupported expectations as test contract defect
```

```yaml
trigger_assertion_grounding:
  case_id: <case id>
  verdict: GROUNDED | TEST_CONTRACT_DEFECT
  factual_assertions:
    - assertion: <required fact or verdict>
      evidence: <exact trigger/context fact or missing>
      status: SUPPORTED | UNSUPPORTED
  expected_verdict_support: <sufficient | insufficient>
  uncertainty_handling: <preserved | collapsed | not applicable>
  next_exact_action: <one action>
```

Local quality gates:

```text
every_factual_must_contain_is_supported_by_trigger_or_attributable_context
expected_verdict_has_sufficient_decision_facts_in_trigger
uncertain_trigger_language_does_not_force_a_certain_factual_conclusion
missing_decision_fact_produces_test_contract_defect_or_not_verified_expectation
assertions_do_not_reward_hallucinated_scope_status_or_authority
```

A grounding review does not require every expected phrase to appear verbatim in the trigger. Valid reasoning may combine supplied facts, but it cannot invent scope, approval, runtime, authority, or verification state.

When a case is `TEST_CONTRACT_DEFECT`, do not score the model against the defective expectation and do not patch the target skill. Correct the test contract first, then rerun validation and behavioral evaluation.

## Output Layout'''

          replace_once(
              skill,
              '- Test version matches `metadata["ai-native-skills.version"]` in the governing `SKILL.md`.\n\n## Output Layout',
              grounding_section,
          )

          replace_once(
              skill,
              "local product override\n```\n\n## Anti-Patterns",
              "local product override\n```\n\nIf a required factual assertion or expected verdict lacks support in the trigger or attributable context, classify the failure as `test contract defect` before changing the target skill.\n\n## Anti-Patterns",
          )

          replace_once(
              skill,
              "| Patch the skill before classifying the failure | Test, routing, or context defects get copied into skill knowledge |",
              "| Force a certain conclusion from `may`, `might`, or missing evidence | The test rewards unsupported assumptions |\n| Treat CI, screenshots, or status labels as approval/runtime proof without the required evidence | Authority and verification states collapse |\n| Patch the skill before classifying the failure | Test, routing, or context defects get copied into skill knowledge |",
          )

          replace_once(
              skill,
              "> **Hard rule:** Send each case trigger verbatim without skill names, hints, or extra steering context.",
              "> **Hard rule:** Send each case trigger verbatim without skill names, hints, or extra steering context.\n\n> **Grounding hard rule:** Never require the evaluated output to assert a factual state that the trigger or attributable context does not establish.",
          )

          replace_once(
              tests,
              "  version: 1.1.1",
              "  version: 1.1.2",
          )
          replace_once(
              tests,
              "  description: Verify skill-eval exposes and applies its reviewed context, workflow, profile, or maintenance contract interface.",
              "  description: Verify skill-eval detects generic behavior and rejects regression expectations that are not grounded by trigger or attributable context facts.",
          )

          extra_cases = '''

  - id: uncertain-overlap-trigger-is-test-contract-defect
    description: Uncertain scope wording cannot force a certain uncovered-scope verdict.
    trigger: Review this regression contract before changing the target skill. Its trigger says an older migration issue may not cover the product self-repository URL, while its assertions require uncovered self-repository scope and OVERLAP_REQUIRES_SCOPE_SPLIT.
    must_contain:
    - TEST_CONTRACT_DEFECT
    - unsupported factual assertion
    - expected verdict has insufficient decision facts
    - uncertain_trigger_language_does_not_force_a_certain_factual_conclusion
    - do not patch the target skill
    must_not_contain:
    - 'verdict: APPLIED'
    - self-repository scope is definitely uncovered
    - patch delivery-work-breakdown
    quality_gates_tested:
    - every_factual_must_contain_is_supported_by_trigger_or_attributable_context
    - expected_verdict_has_sufficient_decision_facts_in_trigger
    - uncertain_trigger_language_does_not_force_a_certain_factual_conclusion

  - id: ci-pass-without-approval-is-test-contract-defect
    description: Green CI cannot supply a missing approval record.
    trigger: Review a regression case whose only evidence says all CI checks passed. The case requires the evaluated output to state approved for merge, but it provides no review, approval, or merge-authorization record.
    must_contain:
    - TEST_CONTRACT_DEFECT
    - approval evidence is missing
    - assertions_do_not_reward_hallucinated_scope_status_or_authority
    - test contract defect
    - do not patch the target skill
    must_not_contain:
    - CI proves approval
    - therefore approved for merge
    - change the implementation skill
    quality_gates_tested:
    - every_factual_must_contain_is_supported_by_trigger_or_attributable_context
    - expected_verdict_has_sufficient_decision_facts_in_trigger
    - assertions_do_not_reward_hallucinated_scope_status_or_authority

  - id: screenshot-without-interaction-is-test-contract-defect
    description: Static visual evidence cannot prove runtime interaction.
    trigger: Review a regression case that provides one static screenshot and no interaction test, event trace, or runtime evidence. Its assertions require the evaluated output to state interaction verified.
    must_contain:
    - TEST_CONTRACT_DEFECT
    - runtime interaction evidence is missing
    - missing_decision_fact_produces_test_contract_defect_or_not_verified_expectation
    - test contract defect
    - correct the test contract first
    must_not_contain:
    - screenshot proves interaction
    - interaction is verified
    - patch the UI skill
    quality_gates_tested:
    - every_factual_must_contain_is_supported_by_trigger_or_attributable_context
    - missing_decision_fact_produces_test_contract_defect_or_not_verified_expectation
    - assertions_do_not_reward_hallucinated_scope_status_or_authority

  - id: explicit-scope-exclusion-is-grounded
    description: Explicit coverage and exclusion facts support a deterministic overlap verdict.
    trigger: Review this regression contract. The trigger explicitly states that the existing issue covers legacy Core and Skills runtime-binding URLs and excludes the product self-repository URL. The assertions require OVERLAP_REQUIRES_SCOPE_SPLIT and uncovered self-repository scope.
    must_contain:
    - GROUNDED
    - OVERLAP_REQUIRES_SCOPE_SPLIT
    - existing issue covers legacy Core and Skills runtime-binding URLs
    - product self-repository URL is excluded
    - expected verdict has sufficient decision facts
    must_not_contain:
    - TEST_CONTRACT_DEFECT
    - unsupported assumption
    - NOT_VERIFIED
    quality_gates_tested:
    - every_factual_must_contain_is_supported_by_trigger_or_attributable_context
    - expected_verdict_has_sufficient_decision_facts_in_trigger
    - uncertain_trigger_language_does_not_force_a_certain_factual_conclusion
'''

          test_file = Path(tests)
          test_file.write_text(test_file.read_text(encoding="utf-8").rstrip() + extra_cases + "\n", encoding="utf-8")
          PY

      - name: Resolve pinned Core revision
        id: core-ref
        run: |
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Regenerate contract coverage evidence
        run: >-
          python scripts/inventory-contract-coverage.py
          --root .
          --core-root .deps/ai-native-core

      - name: Commit improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/skill-eval/SKILL.md contracts/tests/skill-eval.test.yaml docs/contract-coverage-discovery.yaml
          git commit -m "feat(skill-eval): ground assertions in trigger facts (#135)"
          git push origin HEAD:feat/135-trigger-assertion-grounding
