name: Lifecycle Contract Coverage Sync

on:
  push:
    branches:
      - 248-documentation-assurance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'sync generated contract coverage')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout executable adapters
        uses: actions/checkout@v4
        with:
          ref: 248-documentation-assurance
          path: ai-native-skills
          fetch-depth: 0

      - name: Checkout canonical core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          path: ai-native-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install inventory dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Generate canonical contract coverage inventory
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import yaml

          root = Path('ai-native-skills').resolve()
          core = Path('ai-native-core').resolve()
          script = root / 'scripts/inventory-contract-coverage.py'
          spec = importlib.util.spec_from_file_location('inventory_contract_coverage', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          document = module.build_inventory(root, core)
          rendered = yaml.safe_dump(document, sort_keys=False, allow_unicode=True)
          (root / 'docs/contract-coverage-discovery.yaml').write_text(rendered, encoding='utf-8')
          PY

      - name: Commit generated inventory when changed
        working-directory: ai-native-skills
        run: |
          if git diff --quiet -- docs/contract-coverage-discovery.yaml; then
            echo 'Inventory already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/contract-coverage-discovery.yaml
          git commit -m 'chore(coverage): sync generated contract coverage'
          git push origin HEAD:248-documentation-assurance
