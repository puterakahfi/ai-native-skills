name: One-shot maintenance pilot coverage

on:
  push:
    branches:
      - 196-pilot-skill-authoring-maintenance

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 196-pilot-skill-authoring-maintenance
          fetch-depth: 0
      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python scripts/inventory-contract-coverage.py --root . --core-root .deps/ai-native-core
      - name: Commit coverage evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(metadata): refresh maintenance pilot coverage'
          git push "https://x-access-token:${GH_TOKEN}@github.com/puterakahfi/ai-native-skills.git" HEAD:196-pilot-skill-authoring-maintenance