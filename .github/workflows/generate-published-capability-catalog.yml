name: Generate published capability catalog

on:
  workflow_dispatch:
  push:
    branches:
      - 204-feature-published-capability-catalog
    paths:
      - docs/capability-inventory.json
      - catalog/capability-discovery/**
      - scripts/build-published-capability-catalog.py
      - docs/published-capability-catalog.md
      - .github/workflows/generate-published-capability-catalog.yml

permissions:
  contents: write

concurrency:
  group: published-capability-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Generate deterministic catalog
        run: |
          python3 scripts/verify-capability-inventory.py
          python3 scripts/verify-capability-discovery.py
          python3 scripts/build-published-capability-catalog.py \
            --write \
            --source-revision "${GITHUB_SHA}"
          python3 scripts/build-published-capability-catalog.py --check

      - name: Commit generated artifact when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/published/capability-catalog.json; then
            echo "Published catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/published/capability-catalog.json
          git commit -m "chore(catalog): regenerate published capability catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
