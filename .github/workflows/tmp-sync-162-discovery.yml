name: Temporary Sync 162 Discovery

on:
  push:
    branches:
      - feat/162-unit-integration-testing
    paths:
      - .github/workflows/tmp-sync-162-discovery.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register unit and integration testing
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('catalog/capability-discovery/classifications.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          group = next(item for item in data['classification_groups'] if item['id'] == 'engineering-quality')
          for capability in ['integration-testing', 'unit-testing']:
              if capability not in group['capabilities']:
                  group['capabilities'].append(capability)
          group['capabilities'].sort()
          overrides = group.setdefault('overrides', {})
          overrides['unit-testing'] = {
              'lifecycle_stages': ['build', 'verify'],
              'concerns': ['implementation', 'testing', 'code-quality']
          }
          overrides['integration-testing'] = {
              'lifecycle_stages': ['build', 'verify'],
              'concerns': ['integration', 'testing', 'reliability']
          }
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')
      - name: Commit discovery migration
        shell: bash
        run: |
          set -euo pipefail
          git add catalog/capability-discovery/classifications.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(discovery): register unit and integration testing'
          git push origin HEAD:${GITHUB_REF_NAME}
