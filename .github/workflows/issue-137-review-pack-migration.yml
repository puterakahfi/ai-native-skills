name: Issue 137 Review and Pack Migration

on:
  push:
    branches:
      - 137-production-code-quality-baseline
    paths:
      - scripts/apply-production-code-quality-baseline-review-and-pack-migration.py
      - .github/workflows/issue-137-review-pack-migration.yml

permissions:
  contents: write

concurrency:
  group: issue-137-review-pack-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canonical Core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Apply exact review and pack migration
        run: python scripts/apply-production-code-quality-baseline-review-and-pack-migration.py

      - name: Regenerate contract coverage
        run: >-
          python scripts/inventory-contract-coverage.py
          --root .
          --core-root .deps/ai-native-core

      - name: Validate migrated state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-eval-contracts.py
          python scripts/verify-capability-inventory.py
          python scripts/verify-capability-discovery.py
          python scripts/validate-contract-coverage.py --root . --core-root .deps/ai-native-core

      - name: Remove branch-local dependencies and migration source
        run: |
          rm -rf .deps
          rm scripts/apply-production-code-quality-baseline-review-and-pack-migration.py
          rm .github/workflows/issue-137-review-pack-migration.yml

      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(workflows): integrate quality review and packs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
