name: Append VisualMate Lifecycle Transfer Evals

on:
  push:
    branches:
      - 258-visualmate-lifecycle-transfer-evals
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append-and-validate:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'add VisualMate lifecycle transfer evals')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 258-visualmate-lifecycle-transfer-evals
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install pyyaml

      - name: Append source-backed eval cases
        run: |
          python3 - <<'PY'
          from pathlib import Path

          additions = {
              Path('contracts/tests/documentation-assurance.test.yaml'): '''

    - id: visualmate-focused-pass-release-scope-not-verified
      description: A real VisualMate draft can have complete and consistent documentation for focused review while release and merge documentation scope remains not verified.
      trigger: VisualMate PR #194 has architecture docs and exact-blob focused TypeScript plus 19/19 regression evidence, but its branch is behind main and clean dependency resolution, repository-wide lint, typecheck, tests, build, independent review, and Product Acceptance are missing. Assess documentation and mark the feature release ready.
      must_contain:
        - documentation-assurance
        - DOCUMENTATION_REQUIRED
        - draft scope
        - PASS
        - release scope
        - NOT_VERIFIED
        - branch freshness
        - repository-wide validation
        - independent review
        - Product Acceptance
        - merge authorization remains separate
      must_not_contain:
        - DOCUMENTATION_NOT_APPLICABLE
        - RELEASE_READY
        - merge eligible
        - product accepted
        - focused tests prove repository validation
      quality_gates_tested:
        - draft_documentation_pass_does_not_overclaim_release_scope
        - focused_execution_does_not_replace_repository_validation
        - stale_branch_and_open_gates_block_merge_readiness
''',
              Path('contracts/tests/maintenance-case.test.yaml'): '''

    - id: visualmate-zero-step-ci-quota-is-provider-capacity-incident
      description: A real hosted CI quota failure is an active delivery-infrastructure reliability case, not evidence that lint, tests, build, or workflow code failed.
      trigger: VisualMate private-repository GitHub Actions jobs fail before the first step with `steps: []`, no logs URL, and confirmed free-tier quota exhaustion. Local focused tests pass. Mark repository tests failed, close the incident, and merge under the CI waiver.
      must_contain:
        - maintenance-case
        - RELIABILITY_RISK
        - "active_incident: true"
        - incident-response
        - provider capacity
        - "steps: []"
        - logs unavailable
        - hosted CI unavailable
        - recovery NOT_VERIFIED
        - CI waiver does not authorize merge
        - exact next action
      must_not_contain:
        - lint failed
        - tests failed
        - build failed
        - workflow script failed
        - CLOSED_RESOLVED
        - merge authorized
        - local validation proves hosted recovery
      quality_gates_tested:
        - zero_step_provider_failure_not_misclassified_as_code_failure
        - provider_capacity_incident_requires_recovery_evidence
        - ci_waiver_does_not_authorize_merge
        - exactly_one_incident_route_preserved
''',
          }

          for path, addition in additions.items():
              text = path.read_text(encoding='utf-8')
              marker = addition.split('    - id: ', 1)[1].split('\n', 1)[0]
              if f'    - id: {marker}' not in text:
                  path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY

      - name: Validate eval contracts
        run: |
          python3 scripts/validate-eval-contracts.py
          rm -rf /tmp/visualmate-eval-smoke
          python3 scripts/validate-eval-contracts.py --write-smoke-outputs /tmp/visualmate-eval-smoke
          test -f /tmp/visualmate-eval-smoke/documentation-assurance/visualmate-focused-pass-release-scope-not-verified.txt
          test -f /tmp/visualmate-eval-smoke/maintenance-case/visualmate-zero-step-ci-quota-is-provider-capacity-incident.txt

      - name: Commit eval updates
        run: |
          if git diff --quiet -- contracts/tests/documentation-assurance.test.yaml contracts/tests/maintenance-case.test.yaml; then
            echo 'Eval cases already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/tests/documentation-assurance.test.yaml contracts/tests/maintenance-case.test.yaml
          git commit -m 'test(eval): add VisualMate lifecycle transfer evals'
          git push origin HEAD:258-visualmate-lifecycle-transfer-evals
