name: One-shot lifecycle metadata sync

on:
  push:
    branches:
      - 189-skill-lifecycle-integration-v2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 189-skill-lifecycle-integration-v2
          path: ai-native-skills
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          path: ai-native-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Generate synchronized evidence
        working-directory: ai-native-skills
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('catalog/capability-discovery/classifications.json')
          catalog = json.loads(path.read_text(encoding='utf-8'))
          workflows = next(group for group in catalog['classification_groups'] if group['id'] == 'workflows')
          name = 'skill-authoring-workflow'
          if name not in workflows['capabilities']:
              workflows['capabilities'].insert(workflows['capabilities'].index('skill-doctor'), name)
          workflows.setdefault('overrides', {})[name] = {
              'domains': ['quality', 'ai-systems', 'governance', 'developer-experience'],
              'lifecycle_stages': ['define', 'plan', 'build', 'verify', 'release'],
              'concerns': ['workflow-routing', 'delivery', 'governance', 'documentation', 'evaluation']
          }
          path.write_text(json.dumps(catalog, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python scripts/verify-capability-inventory.py --write-snapshot --skip-docs
          python - <<'PY'
          import json, re
          from pathlib import Path
          counts = json.loads(Path('docs/capability-inventory.json').read_text(encoding='utf-8'))['counts']
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'\*\*\d+ skills · \d+ workflows · \d+ meta-skills\*\*', f"**{counts['skill']} skills · {counts['workflow']} workflows · {counts['meta-skill']} meta-skills**", text, count=1)
          readme.write_text(text, encoding='utf-8')
          taxonomy = Path('docs/skills.md')
          text = taxonomy.read_text(encoding='utf-8')
          replacements = {
              r'^- `skill`: \d+$': f"- `skill`: {counts['skill']}",
              r'^- `workflow`: \d+$': f"- `workflow`: {counts['workflow']}",
              r'^- `meta-skill`: \d+$': f"- `meta-skill`: {counts['meta-skill']}",
              r'^- Total executable skills: \d+$': f"- Total executable skills: {counts['total']}",
          }
          for pattern, replacement in replacements.items():
              text = re.sub(pattern, replacement, text, count=1, flags=re.MULTILINE)
          row = '| `skill-authoring-workflow` | classify operation → discover → shape package → implement → validate → review → deliver |'
          if row not in text:
              text = text.replace('| `skill-doctor` | audit → triage → repair → verify |', row + '\n| `skill-doctor` | audit → triage → repair → verify |', 1)
          taxonomy.write_text(text, encoding='utf-8')
          PY
          python scripts/verify-capability-inventory.py
          python scripts/inventory-contract-coverage.py --root . --core-root ../ai-native-core
      - name: Commit generated metadata
        working-directory: ai-native-skills
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/skills.md catalog/capability-discovery/classifications.json docs/capability-inventory.json docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(metadata): synchronize lifecycle integration evidence'
          git push origin HEAD:189-skill-lifecycle-integration-v2
