name: Generate Epic 260 Validation Artifacts

on:
  pull_request:
    branches:
      - 260-hermes-agent-fleet-bootstrap
    paths:
      - .github/workflows/epic-260-generate-validation-artifacts.yml
      - skills/hermes-agent-fleet-bootstrap/**
      - contracts/tests/hermes-agent-fleet-bootstrap.test.yaml
      - catalog/capability-discovery/**
      - catalog/published/capability-catalog.json
      - docs/capability-inventory.json
      - docs/contract-coverage-discovery.yaml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Patch canonical sources deterministically
        shell: python
        run: |
          import importlib.util
          import json
          import re
          from pathlib import Path

          capability = 'hermes-agent-fleet-bootstrap'

          test_path = Path('contracts/tests/hermes-agent-fleet-bootstrap.test.yaml')
          test_text = test_path.read_text(encoding='utf-8')
          test_text, replaced = re.subn(r'(?m)^(\s*)- false$', r'\1- "false"', test_text, count=1)
          if replaced != 1:
              raise SystemExit('expected one unquoted false fixture')
          test_path.write_text(test_text, encoding='utf-8')

          skill_path = Path('skills/hermes-agent-fleet-bootstrap/SKILL.md')
          skill = skill_path.read_text(encoding='utf-8')
          bullet = '- Load `references/catalog-migration-and-idempotency.md` for capability resolution, existing-profile audit, migration planning, dry-run, and idempotency checks.\n'
          anchor = '- Load `references/runtime-gateway-and-security.md` for bots, workers, permissions, sandbox evidence, and runtime limitations.\n'
          if bullet not in skill:
              if anchor not in skill:
                  raise SystemExit('fleet reference anchor not found')
              skill = skill.replace(anchor, anchor + bullet, 1)
          skill_path.write_text(skill, encoding='utf-8')

          inventory_script = Path('scripts/verify-capability-inventory.py')
          spec = importlib.util.spec_from_file_location('capability_inventory', inventory_script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          counts = module.derive_inventory()['counts']

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text, replaced = re.subn(r'\*\*\d+ skills · \d+ workflows · \d+ meta-skills\*\*', f"**{counts['skill']} skills · {counts['workflow']} workflows · {counts['meta-skill']} meta-skills**", readme_text, count=1)
          if replaced != 1:
              raise SystemExit('README count not replaced once')
          readme.write_text(readme_text, encoding='utf-8')

          taxonomy = Path('docs/skills.md')
          taxonomy_text = taxonomy.read_text(encoding='utf-8')
          replacements = {
              r'^- `skill`: \d+$': f"- `skill`: {counts['skill']}",
              r'^- `workflow`: \d+$': f"- `workflow`: {counts['workflow']}",
              r'^- `meta-skill`: \d+$': f"- `meta-skill`: {counts['meta-skill']}",
              r'^- Total executable skills: \d+$': f"- Total executable skills: {counts['total']}",
          }
          for pattern, replacement in replacements.items():
              taxonomy_text, changed = re.subn(pattern, replacement, taxonomy_text, count=1, flags=re.MULTILINE)
              if changed != 1:
                  raise SystemExit(f'taxonomy count not replaced once: {pattern}')
          taxonomy.write_text(taxonomy_text, encoding='utf-8')

          classifications_path = Path('catalog/capability-discovery/classifications.json')
          classifications = json.loads(classifications_path.read_text(encoding='utf-8'))
          group = next(group for group in classifications['classification_groups'] if group['id'] == 'ai-agent-systems')
          if capability not in group['capabilities']:
              group['capabilities'].append(capability)
              group['capabilities'].sort()
          group.setdefault('overrides', {})[capability] = {
              'domains': ['ai-systems', 'developer-experience', 'governance'],
              'lifecycle_stages': ['plan', 'build', 'verify'],
              'concerns': ['workflow-routing', 'implementation', 'context', 'developer-experience', 'governance'],
              'ecosystems': ['ai-agent-runtime'],
          }
          classifications_path.write_text(json.dumps(classifications, separators=(',', ':')) + '\n', encoding='utf-8')

          topics_path = Path('catalog/capability-discovery/topics.json')
          topics = json.loads(topics_path.read_text(encoding='utf-8'))
          for topic in topics['topics']:
              if topic['id'] in {'agent-workflows', 'ai-agent-systems', 'developer-experience'} and capability not in topic['capabilities']:
                  topic['capabilities'].append(capability)
          topics_path.write_text(json.dumps(topics, separators=(',', ':')) + '\n', encoding='utf-8')

      - name: Regenerate inventory and published catalog
        run: |
          python3 scripts/verify-capability-inventory.py --write-snapshot
          python3 scripts/verify-capability-discovery.py
          python3 scripts/build-published-capability-catalog.py --write --source-revision "$(git rev-parse HEAD)"
          python3 -m unittest scripts/tests/test_build_published_capability_catalog.py
          python3 scripts/build-published-capability-catalog.py --check
          python3 scripts/validate-eval-contracts.py

      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - name: Regenerate and validate contract coverage
        run: |
          python3 scripts/inventory-contract-coverage.py --root . --core-root .deps/ai-native-core
          python3 scripts/validate-contract-coverage.py --root . --core-root .deps/ai-native-core

      - name: Commit verified artifacts and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 260-hermes-agent-fleet-bootstrap
          git checkout origin/260-hermes-agent-fleet-bootstrap -- .github/workflows/sync-generated-capability-metadata.yml
          git rm -f .github/workflows/epic-260-generate-validation-artifacts.yml
          if test -f .github/workflows/epic-260-register-hermes-fleet-capability.yml; then
            git rm -f .github/workflows/epic-260-register-hermes-fleet-capability.yml
          fi
          git add README.md \
                  docs/skills.md \
                  docs/capability-inventory.json \
                  docs/contract-coverage-discovery.yaml \
                  catalog/capability-discovery/classifications.json \
                  catalog/capability-discovery/topics.json \
                  catalog/published/capability-catalog.json \
                  skills/hermes-agent-fleet-bootstrap/SKILL.md \
                  contracts/tests/hermes-agent-fleet-bootstrap.test.yaml \
                  .github/workflows/sync-generated-capability-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(hermes): commit verified fleet bootstrap artifacts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
