name: Issue 272 CLI Security Hardening

on:
  push:
    branches:
      - feat/272-cli-security-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic safety patch
        shell: python
        run: |
          from pathlib import Path

          cli = Path('skills/hermes-agent-fleet-bootstrap/scripts/hermes_fleet.py')
          text = cli.read_text(encoding='utf-8')

          text = text.replace(
              'import os\nimport shutil',
              'import os\nimport re\nimport shutil',
              1,
          )

          old = '''class FleetError(RuntimeError):
              pass


          def utc_now() -> str:
          '''
          new = '''class FleetError(RuntimeError):
              pass


          SAFE_IDENTIFIER = re.compile(r"^[a-z0-9][a-z0-9._-]{0,127}$")


          def validate_identifier(value: Any, label: str) -> str:
              if not isinstance(value, str) or not SAFE_IDENTIFIER.fullmatch(value):
                  raise FleetError(
                      f"Unsafe {label}: {value!r}; use lowercase letters, digits, dot, underscore, or hyphen"
                  )
              return value


          def utc_now() -> str:
          '''
          if old not in text:
              raise SystemExit('FleetError insertion point not found')
          text = text.replace(old, new, 1)

          old = '''    profiles = data.get("profiles")
              if not isinstance(profiles, list) or not profiles:
                  raise FleetError("Preset profiles must be a non-empty list")
              ids: list[str] = []
          '''
          new = '''    validate_identifier(data["id"], "preset id")
              validate_identifier(data["orchestrator"], "orchestrator id")
              profiles = data.get("profiles")
              if not isinstance(profiles, list) or not profiles:
                  raise FleetError("Preset profiles must be a non-empty list")
              ids: list[str] = []
          '''
          if old not in text:
              raise SystemExit('Preset root validation insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        if not isinstance(profile["skills"], list) or not all(
                      isinstance(item, str) and item for item in profile["skills"]
                  ):
                      raise FleetError(f"Profile skills must be string list: {profile['id']}")
                  ids.append(profile["id"])
          '''
          new = '''        if not isinstance(profile["skills"], list) or not all(
                      isinstance(item, str) and item for item in profile["skills"]
                  ):
                      raise FleetError(f"Profile skills must be string list: {profile['id']}")
                  validate_identifier(profile["id"], "profile id")
                  if profile["gateway"] not in {"eligible", "none"}:
                      raise FleetError(
                          f"Unsupported gateway policy for {profile['id']}: {profile['gateway']!r}"
                      )
                  for skill in profile["skills"]:
                      validate_identifier(skill, "skill id")
                  ids.append(profile["id"])
          '''
          if old not in text:
              raise SystemExit('Profile validation insertion point not found')
          text = text.replace(old, new, 1)

          old = '''def directory_digest(path: Path) -> str:
              digest = hashlib.sha256()
              if not path.exists():
                  return "MISSING"
              for file_path in sorted(p for p in path.rglob("*") if p.is_file()):
                  rel = file_path.relative_to(path).as_posix()
                  if any(part in {"__pycache__", ".git"} for part in file_path.parts):
                      continue
                  digest.update(rel.encode("utf-8"))
                  digest.update(b"\\0")
                  digest.update(file_path.read_bytes())
                  digest.update(b"\\0")
              return digest.hexdigest()
          '''
          new = '''def directory_digest(path: Path) -> str:
              digest = hashlib.sha256()
              if path.is_symlink():
                  raise FleetError(f"Symlinked managed path is not allowed: {path}")
              if not path.exists():
                  return "MISSING"
              if not path.is_dir():
                  raise FleetError(f"Managed path must be a directory: {path}")
              for candidate in sorted(path.rglob("*")):
                  if candidate.is_symlink():
                      raise FleetError(f"Symlink inside managed skill source is not allowed: {candidate}")
                  if not candidate.is_file():
                      continue
                  rel = candidate.relative_to(path).as_posix()
                  if any(part in {"__pycache__", ".git"} for part in candidate.parts):
                      continue
                  digest.update(rel.encode("utf-8"))
                  digest.update(b"\\0")
                  digest.update(candidate.read_bytes())
                  digest.update(b"\\0")
              return digest.hexdigest()
          '''
          if old not in text:
              raise SystemExit('directory_digest replacement point not found')
          text = text.replace(old, new, 1)

          old = '''    actions: list[Action] = []
              findings: list[str] = []
              for profile in preset["profiles"]:
                  profile_id = profile["id"]
                  profile_dir = hermes_home / "profiles" / profile_id
          '''
          new = '''    actions: list[Action] = []
              findings: list[str] = []
              profiles_root = hermes_home / "profiles"
              if profiles_root.is_symlink():
                  raise FleetError(f"Symlinked Hermes profiles root is not allowed: {profiles_root}")
              for profile in preset["profiles"]:
                  profile_id = profile["id"]
                  profile_dir = profiles_root / profile_id
                  if profile_dir.is_symlink():
                      raise FleetError(f"Symlinked Hermes profile directory is not allowed: {profile_dir}")
                  profile_skills_dir = profile_dir / "skills"
                  if profile_skills_dir.is_symlink():
                      raise FleetError(f"Symlinked profile skills directory is not allowed: {profile_skills_dir}")
          '''
          if old not in text:
              raise SystemExit('plan_actions safety insertion point not found')
          text = text.replace(old, new, 1)

          old = '''            source = skills_root / skill
                      target = profile_dir / "skills" / skill
                      source_hash = directory_digest(source)
          '''
          new = '''            source = skills_root / skill
                      target = profile_skills_dir / skill
                      if source.exists() and not (source / "SKILL.md").is_file():
                          actions.append(
                              Action(
                                  "skill",
                                  f"{profile_id}:{skill}",
                                  "BLOCKED_INVALID_SOURCE",
                                  "Skill source is missing SKILL.md",
                              )
                          )
                          findings.append(f"invalid_skill_source:{skill}")
                          continue
                      source_hash = directory_digest(source)
          '''
          if old not in text:
              raise SystemExit('Skill source safety insertion point not found')
          text = text.replace(old, new, 1)

          cli.write_text(text, encoding='utf-8')

          tests = Path('skills/hermes-agent-fleet-bootstrap/tests/test_hermes_fleet.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''    def test_profile_command_failure_is_reported(self) -> None:
          '''
          addition = '''    def test_preset_rejects_path_traversal_identifier(self) -> None:
                  malicious = {
                      "id": "test-fleet",
                      "version": "1.0.0",
                      "topology": "orchestrator_with_specialists",
                      "orchestrator": "../escape",
                      "profiles": [
                          {
                              "id": "../escape",
                              "description": "Unsafe profile.",
                              "gateway": "eligible",
                              "skills": ["fleet-skill"],
                          }
                      ],
                  }
                  with self.assertRaises(module.FleetError):
                      module.validate_preset(malicious)

              def test_symlink_skill_source_is_rejected_before_mutation(self) -> None:
                  source = self.skills / "review-skill"
                  external = self.tmp / "external-review-skill"
                  source.rename(external)
                  try:
                      source.symlink_to(external, target_is_directory=True)
                  except (OSError, NotImplementedError):
                      self.skipTest("Symlinks are unavailable on this platform")
                  code = self.run_cli("--apply")
                  self.assertEqual(code, module.EXIT_PREFLIGHT)
                  self.assertFalse((self.home / "profiles").exists())
                  receipt = json.loads(self.receipt.read_text(encoding="utf-8"))
                  self.assertEqual(receipt["readiness"], "BLOCKED")
                  self.assertTrue(any("Symlink" in item for item in receipt["findings"]))

          '''
          if marker not in test_text:
              raise SystemExit('Test insertion point not found')
          test_text = test_text.replace(marker, addition + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
      - name: Validate hardening
        run: |
          python -m py_compile skills/hermes-agent-fleet-bootstrap/scripts/hermes_fleet.py
          python -m unittest discover -s skills/hermes-agent-fleet-bootstrap/tests -v
      - name: Commit hardened implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-272-cli-security-hardening.yml
          git add skills/hermes-agent-fleet-bootstrap/scripts/hermes_fleet.py \
                  skills/hermes-agent-fleet-bootstrap/tests/test_hermes_fleet.py \
                  .github/workflows/issue-272-cli-security-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(hermes): harden one-command preset and skill paths [#272]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
