name: Sync issue 132 generated metadata

on:
  push:
    branches:
      - feat/132-work-item-deduplication
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout executable repository
        uses: actions/checkout@v4
        with:
          ref: feat/132-work-item-deduplication
          fetch-depth: 0

      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canonical Core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install metadata dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Regenerate repository metadata
        run: |
          python scripts/verify-capability-inventory.py --write-snapshot
          python scripts/inventory-contract-coverage.py \
            --root . \
            --core-root .deps/ai-native-core

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capability-inventory.json docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then
            echo "Generated metadata is already current."
            exit 0
          fi
          git commit -m "chore(metadata): sync generated capability evidence (#132)"
          git push origin HEAD:feat/132-work-item-deduplication
