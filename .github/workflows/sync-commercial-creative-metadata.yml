name: Sync Commercial Creative Metadata

on:
  pull_request:
    branches:
      - 140-commercial-creative-production-spec
    paths:
      - .github/workflows/sync-commercial-creative-metadata.yml
      - skills/commercial-creative-production/**
      - skills/workflow-router/SKILL.md
      - skills/role-switcher/SKILL.md
      - catalog/capability-discovery/**
      - README.md
      - docs/skills.md

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canonical Core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Register commercial creative discovery metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          capability = "commercial-creative-production"

          classifications_path = Path("catalog/capability-discovery/classifications.json")
          classifications = json.loads(classifications_path.read_text(encoding="utf-8"))
          workflow_group = next(
              group for group in classifications["classification_groups"]
              if group["id"] == "workflows"
          )
          if capability not in workflow_group["capabilities"]:
              workflow_group["capabilities"].insert(0, capability)
          workflow_group.setdefault("overrides", {})[capability] = {
              "domains": ["design", "quality", "growth-marketing"],
              "lifecycle_stages": ["define", "design", "build", "verify", "release"],
              "concerns": ["workflow-routing", "visual-design", "content", "delivery", "review"],
          }
          classifications_path.write_text(
              json.dumps(classifications, separators=(",", ":")),
              encoding="utf-8",
          )

          topics_path = Path("catalog/capability-discovery/topics.json")
          topics = json.loads(topics_path.read_text(encoding="utf-8"))
          for topic_id in ("design-ui", "agent-workflows", "growth-marketing"):
              topic = next(item for item in topics["topics"] if item["id"] == topic_id)
              if capability not in topic["capabilities"]:
                  topic["capabilities"].insert(0, capability)
          topics_path.write_text(
              json.dumps(topics, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Synchronize readable inventory documentation
        shell: bash
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          counts = Counter()
          for skill_file in sorted(Path("skills").glob("*/SKILL.md")):
              text = skill_file.read_text(encoding="utf-8")
              match = re.search(r"^\s+ai-native-skills\.type:\s*(\S+)\s*$", text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"missing official type: {skill_file}")
              counts[match.group(1).strip("'\"")] += 1

          skills = counts["skill"]
          workflows = counts["workflow"]
          meta = counts["meta-skill"]
          total = skills + workflows + meta

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme, replacements = re.subn(
              r"\*\*\d+ skills · \d+ workflows · \d+ meta-skills\*\*",
              f"**{skills} skills · {workflows} workflows · {meta} meta-skills**",
              readme,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("README inventory summary anchor missing")
          readme_path.write_text(readme, encoding="utf-8")

          taxonomy_path = Path("docs/skills.md")
          taxonomy = taxonomy_path.read_text(encoding="utf-8")
          replacements = {
              r"^- `skill`: \d+$": f"- `skill`: {skills}",
              r"^- `workflow`: \d+$": f"- `workflow`: {workflows}",
              r"^- `meta-skill`: \d+$": f"- `meta-skill`: {meta}",
              r"^- Total executable skills: \d+$": f"- Total executable skills: {total}",
          }
          for pattern, replacement in replacements.items():
              taxonomy, changed = re.subn(pattern, replacement, taxonomy, count=1, flags=re.MULTILINE)
              if changed != 1:
                  raise SystemExit(f"taxonomy count anchor missing: {pattern}")

          workflow_row = "| `commercial-creative-production` | route → intake → asset readiness → commercial direction → provider execution → exported evidence → independent static review → destination delivery |"
          if workflow_row not in taxonomy:
              table_anchor = "| Workflow | Lifecycle |\n|---|---|\n"
              if table_anchor not in taxonomy:
                  raise SystemExit("workflow table anchor missing")
              taxonomy = taxonomy.replace(table_anchor, table_anchor + workflow_row + "\n", 1)
          taxonomy_path.write_text(taxonomy, encoding="utf-8")
          PY

      - name: Regenerate canonical capability evidence
        run: |
          python scripts/verify-capability-inventory.py --write-snapshot
          python scripts/inventory-contract-coverage.py \
            --root . \
            --core-root .deps/ai-native-core \
            --output docs/contract-coverage-discovery.yaml

      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git add \
            README.md \
            docs/skills.md \
            catalog/capability-discovery/classifications.json \
            catalog/capability-discovery/topics.json \
            docs/capability-inventory.json \
            docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then
            echo "Commercial creative metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metadata): register commercial creative production"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
