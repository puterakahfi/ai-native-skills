name: Sync Commercial Creative Metadata

on:
  pull_request:
    branches:
      - 140-commercial-creative-production-spec
    paths:
      - .github/workflows/sync-commercial-creative-metadata.yml
      - skills/commercial-creative-production/**
      - skills/workflow-router/SKILL.md
      - skills/role-switcher/SKILL.md
      - catalog/capability-discovery/**

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canonical Core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Register commercial creative discovery metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          capability = "commercial-creative-production"

          classifications_path = Path("catalog/capability-discovery/classifications.json")
          classifications = json.loads(classifications_path.read_text(encoding="utf-8"))
          workflow_group = next(
              group for group in classifications["classification_groups"]
              if group["id"] == "workflows"
          )
          if capability not in workflow_group["capabilities"]:
              workflow_group["capabilities"].insert(0, capability)
          workflow_group.setdefault("overrides", {})[capability] = {
              "domains": ["design", "quality", "growth-marketing"],
              "lifecycle_stages": ["define", "design", "build", "verify", "release"],
              "concerns": ["workflow-routing", "visual-design", "content", "delivery", "review"],
          }
          classifications_path.write_text(
              json.dumps(classifications, separators=(",", ":")),
              encoding="utf-8",
          )

          topics_path = Path("catalog/capability-discovery/topics.json")
          topics = json.loads(topics_path.read_text(encoding="utf-8"))
          for topic_id in ("design-ui", "agent-workflows", "growth-marketing"):
              topic = next(item for item in topics["topics"] if item["id"] == topic_id)
              if capability not in topic["capabilities"]:
                  topic["capabilities"].insert(0, capability)
          topics_path.write_text(
              json.dumps(topics, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Regenerate canonical capability evidence
        run: |
          python scripts/verify-capability-inventory.py --write-snapshot
          python scripts/inventory-contract-coverage.py \
            --root . \
            --core-root .deps/ai-native-core \
            --output docs/contract-coverage-discovery.yaml

      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git add \
            catalog/capability-discovery/classifications.json \
            catalog/capability-discovery/topics.json \
            docs/capability-inventory.json \
            docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then
            echo "Commercial creative metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metadata): register commercial creative production"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
