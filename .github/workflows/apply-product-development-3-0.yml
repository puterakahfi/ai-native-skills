name: Apply Product Development 3.0

on:
  push:
    branches:
      - feat/231-product-development-12-phases

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/231-product-development-12-phases
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/apply_product_development_3_0.py
      - name: Remove one-time migration resources
        run: |
          rm scripts/apply_product_development_3_0.py
          rm .github/workflows/apply-product-development-3-0.yml
      - name: Commit migrated workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/product-development-workflow contracts/tests/product-development-workflow.test.yaml docs/contract-coverage-discovery.yaml scripts/apply_product_development_3_0.py .github/workflows/apply-product-development-3-0.yml
          git commit -m "feat: expand product-development workflow to 12 phases"
          git push origin HEAD:feat/231-product-development-12-phases
