name: Apply product phase compositions

on:
  push:
    branches:
      - feat/239-complete-product-phase-compositions
    paths:
      - scripts/apply_product_phase_compositions.py
      - .github/workflows/apply-product-phase-compositions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/239-complete-product-phase-compositions
      - name: Apply composition package
        run: python3 scripts/apply_product_phase_compositions.py
      - name: Commit final files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(product): complete phase composition contracts'
          git push
