name: One-shot API compatibility pilot sync

on:
  push:
    branches:
      - 196-pilot-api-backward-compatibility-review

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 196-pilot-api-backward-compatibility-review
          fetch-depth: 0
      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Register capability and synchronize evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          path = Path('catalog/capability-discovery/classifications.json')
          catalog = json.loads(path.read_text(encoding='utf-8'))
          group = next(item for item in catalog['classification_groups'] if item['id'] == 'engineering-quality')
          name = 'api-backward-compatibility-review'
          if name not in group['capabilities']:
              group['capabilities'].insert(group['capabilities'].index('architecture-review'), name)
          group.setdefault('overrides', {})[name] = {
              'domains': ['engineering', 'quality', 'governance'],
              'lifecycle_stages': ['design', 'verify', 'release'],
              'concerns': ['api-contracts', 'review', 'governance']
          }
          path.write_text(json.dumps(catalog, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python - <<'PY'
          import importlib.util, re
          from pathlib import Path
          script = Path('scripts/verify-capability-inventory.py')
          spec = importlib.util.spec_from_file_location('capability_inventory', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          counts = module.derive_inventory()['counts']
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'\*\*\d+ skills · \d+ workflows · \d+ meta-skills\*\*', f"**{counts['skill']} skills · {counts['workflow']} workflows · {counts['meta-skill']} meta-skills**", text, count=1)
          readme.write_text(text, encoding='utf-8')
          taxonomy = Path('docs/skills.md')
          text = taxonomy.read_text(encoding='utf-8')
          replacements = {
              r'^- `skill`: \d+$': f"- `skill`: {counts['skill']}",
              r'^- `workflow`: \d+$': f"- `workflow`: {counts['workflow']}",
              r'^- `meta-skill`: \d+$': f"- `meta-skill`: {counts['meta-skill']}",
              r'^- Total executable skills: \d+$': f"- Total executable skills: {counts['total']}",
          }
          for pattern, replacement in replacements.items():
              text = re.sub(pattern, replacement, text, count=1, flags=re.MULTILINE)
          taxonomy.write_text(text, encoding='utf-8')
          PY
          python scripts/verify-capability-inventory.py --write-snapshot
          python scripts/inventory-contract-coverage.py --root . --core-root .deps/ai-native-core
      - name: Commit generated evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add catalog/capability-discovery/classifications.json README.md docs/skills.md docs/capability-inventory.json docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(metadata): sync API compatibility pilot evidence'
          git push "https://x-access-token:${GH_TOKEN}@github.com/puterakahfi/ai-native-skills.git" HEAD:196-pilot-api-backward-compatibility-review
