name: Epic 260 Hermes Runtime Acceptance Specification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_HOME: ${{ runner.temp }}/epic-260-hermes-home
      HERMES_INSTALL_DIR: ${{ runner.temp }}/epic-260-hermes-install
      BOARD: epic-260-runtime-validation
      EVIDENCE_DIR: ${{ github.workspace }}/.tmp/epic-260-hermes-runtime
    steps:
      - name: Run isolated direct Hermes fleet acceptance
        shell: bash
        run: bash scripts/run-hermes-fleet-runtime-acceptance.sh
