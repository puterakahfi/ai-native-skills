name: Epic 260 Hermes Runtime Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - 265-fleet-real-runtime-acceptance
    paths:
      - .github/workflows/epic-260-hermes-runtime-acceptance.yml
      - skills/hermes-agent-fleet-bootstrap/**
      - docs/hermes-agent-fleet-bootstrap-*.md

permissions:
  contents: read

jobs:
  runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_HOME: ${{ runner.temp }}/epic-260-hermes-home
      HERMES_INSTALL_DIR: ${{ runner.temp }}/epic-260-hermes-install
      BOARD: epic-260-runtime-validation
      EVIDENCE_DIR: ${{ github.workspace }}/.tmp/epic-260-hermes-runtime

    steps:
      - name: Checkout Epic acceptance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HERMES_HOME" "$HERMES_INSTALL_DIR" "$EVIDENCE_DIR"
          mkdir -p "$HERMES_HOME" "$HERMES_INSTALL_DIR" "$EVIDENCE_DIR"
          printf 'home=%s\ninstall=%s\n' "$HERMES_HOME" "$HERMES_INSTALL_DIR" > "$EVIDENCE_DIR/isolation.txt"

      - name: Install official Hermes CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh \
            | bash -s -- \
                --skip-setup \
                --skip-browser \
                --branch main \
                --dir "$HERMES_INSTALL_DIR" \
                --hermes-home "$HERMES_HOME" \
            > "$EVIDENCE_DIR/install.log" 2>&1

          export PATH="$HOME/.local/bin:$PATH"
          if command -v hermes >/dev/null 2>&1; then
            HERMES_BIN="$(command -v hermes)"
          elif test -x "$HOME/.local/bin/hermes"; then
            HERMES_BIN="$HOME/.local/bin/hermes"
          else
            HERMES_BIN="$(find "$HERMES_INSTALL_DIR" -type f -path '*/bin/hermes' -perm -u+x | head -1)"
          fi
          test -n "$HERMES_BIN"
          test -x "$HERMES_BIN"
          echo "HERMES_BIN=$HERMES_BIN" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HERMES_BIN" --version | tee "$EVIDENCE_DIR/version.txt"
          git -C "$HERMES_INSTALL_DIR" rev-parse HEAD | tee "$EVIDENCE_DIR/hermes-source-revision.txt"

      - name: Capture fail-closed diagnostics without credentials
        shell: bash
        run: |
          set +e
          "$HERMES_BIN" doctor > "$EVIDENCE_DIR/doctor.txt" 2>&1
          DOCTOR_RC=$?
          "$HERMES_BIN" dump > "$EVIDENCE_DIR/dump.txt" 2>&1
          DUMP_RC=$?
          set -e
          printf '%s\n' "$DOCTOR_RC" > "$EVIDENCE_DIR/doctor.exit"
          printf '%s\n' "$DUMP_RC" > "$EVIDENCE_DIR/dump.exit"

      - name: Create bounded specialist profiles
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_BIN" profile create engineering-orchestrator \
            --no-skills --no-alias \
            --description "Coordinates workflow routing, durable task decomposition, artifact handoffs, and final synthesis without taking specialist ownership."
          "$HERMES_BIN" profile create solution-architecture \
            --no-skills --no-alias \
            --description "Owns solution boundaries, architecture decisions, technical contracts, risks, and implementation guidance."
          "$HERMES_BIN" profile create backend-platform \
            --no-skills --no-alias \
            --description "Owns backend services, APIs, persistence, integrations, and backend verification within approved architecture."
          "$HERMES_BIN" profile create quality-review \
            --no-skills --no-alias \
            --description "Independently evaluates acceptance evidence, architecture conformance, regressions, and release readiness."

          "$HERMES_BIN" profile list | tee "$EVIDENCE_DIR/profiles-list.txt"
          for profile in engineering-orchestrator solution-architecture backend-platform quality-review; do
            "$HERMES_BIN" profile show "$profile" > "$EVIDENCE_DIR/profile-${profile}.txt"
            "$HERMES_BIN" profile describe "$profile" > "$EVIDENCE_DIR/profile-${profile}-description.txt"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json, os

          root = Path(os.environ['HERMES_HOME'])
          profiles = ['engineering-orchestrator', 'solution-architecture', 'backend-platform', 'quality-review']
          observed = {}
          for name in profiles:
              path = root / 'profiles' / name
              if not path.is_dir():
                  raise SystemExit(f'missing profile directory: {path}')
              observed[name] = {
                  'path': str(path),
                  'profile_yaml': (path / 'profile.yaml').is_file(),
                  'no_bundled_skills_marker': (path / '.no-bundled-skills').is_file(),
              }
          if len({item['path'] for item in observed.values()}) != len(profiles):
              raise SystemExit('profile paths are not unique')
          Path(os.environ['EVIDENCE_DIR'], 'profile-isolation.json').write_text(
              json.dumps(observed, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Install fleet bootstrap skill into orchestrator
        shell: bash
        run: |
          set +e
          SKILL_URL="https://raw.githubusercontent.com/puterakahfi/ai-native-skills/${GITHUB_SHA}/skills/hermes-agent-fleet-bootstrap/SKILL.md"
          "$HERMES_BIN" -p engineering-orchestrator skills install "$SKILL_URL" --force \
            > "$EVIDENCE_DIR/skill-install.txt" 2>&1
          SKILL_INSTALL_RC=$?
          "$HERMES_BIN" -p engineering-orchestrator skills list \
            > "$EVIDENCE_DIR/orchestrator-skills.txt" 2>&1
          SKILL_LIST_RC=$?
          "$HERMES_BIN" -p engineering-orchestrator prompt-size --json \
            > "$EVIDENCE_DIR/orchestrator-prompt-size.json" 2>&1
          PROMPT_SIZE_RC=$?
          set -e
          printf '%s\n' "$SKILL_INSTALL_RC" > "$EVIDENCE_DIR/skill-install.exit"
          printf '%s\n' "$SKILL_LIST_RC" > "$EVIDENCE_DIR/skill-list.exit"
          printf '%s\n' "$PROMPT_SIZE_RC" > "$EVIDENCE_DIR/prompt-size.exit"
          test "$SKILL_INSTALL_RC" -eq 0
          grep -q 'hermes-agent-fleet-bootstrap' "$EVIDENCE_DIR/orchestrator-skills.txt"

      - name: Verify orchestrator-only gateway baseline
        shell: bash
        run: |
          set -euo pipefail
          for profile in engineering-orchestrator solution-architecture backend-platform quality-review; do
            set +e
            "$HERMES_BIN" -p "$profile" gateway status > "$EVIDENCE_DIR/gateway-${profile}.txt" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$EVIDENCE_DIR/gateway-${profile}.exit"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          root = Path(os.environ['HERMES_HOME'])
          profiles = ['engineering-orchestrator', 'solution-architecture', 'backend-platform', 'quality-review']
          sensitive_names = re.compile(r'(BOT_TOKEN|TELEGRAM|DISCORD|SLACK|GATEWAY_RELAY_SECRET|API_KEY)', re.I)
          result = {}
          for name in profiles:
              env_file = root / 'profiles' / name / '.env'
              configured = []
              if env_file.is_file():
                  for line in env_file.read_text(encoding='utf-8', errors='ignore').splitlines():
                      line = line.strip()
                      if not line or line.startswith('#') or '=' not in line:
                          continue
                      key, value = line.split('=', 1)
                      if sensitive_names.search(key) and value.strip():
                          configured.append(key)
              result[name] = {
                  'dedicated_gateway_expected': name == 'engineering-orchestrator',
                  'sensitive_gateway_or_provider_keys_configured': configured,
              }
          if any(item['sensitive_gateway_or_provider_keys_configured'] for item in result.values()):
              raise SystemExit('ephemeral profiles unexpectedly contain configured sensitive values')
          Path(os.environ['EVIDENCE_DIR'], 'gateway-policy.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Initialize durable Kanban board and test idempotency
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_BIN" kanban init | tee "$EVIDENCE_DIR/kanban-init.txt"
          "$HERMES_BIN" kanban boards create "$BOARD" \
            --name "Epic 260 Runtime Validation" \
            --description "Isolated direct Hermes validation for specialist fleet bootstrap" \
            --switch | tee "$EVIDENCE_DIR/board-create.txt"
          "$HERMES_BIN" kanban boards show | tee "$EVIDENCE_DIR/board-show.txt"

          create_task() {
            "$HERMES_BIN" kanban --board "$BOARD" create "$1" \
              --body "$2" \
              --assignee "$3" \
              --workspace scratch \
              --idempotency-key "$4"
          }

          create_task "Coordinate Epic 260 runtime acceptance" \
            "Decompose runtime checks and synthesize actual evidence without claiming model execution." \
            engineering-orchestrator epic260-orchestrator \
            | tee "$EVIDENCE_DIR/create-orchestrator.txt"
          create_task "Coordinate Epic 260 runtime acceptance" \
            "Decompose runtime checks and synthesize actual evidence without claiming model execution." \
            engineering-orchestrator epic260-orchestrator \
            | tee "$EVIDENCE_DIR/create-orchestrator-repeat.txt"
          create_task "Inspect fleet architecture contract" \
            "Verify bounded profile responsibilities and produce an architecture handoff." \
            solution-architecture epic260-architecture \
            | tee "$EVIDENCE_DIR/create-architecture.txt"
          create_task "Produce Kanban persistence evidence" \
            "Consume the architecture handoff and record durable board evidence." \
            backend-platform epic260-backend \
            | tee "$EVIDENCE_DIR/create-backend.txt"
          create_task "Review integrated runtime evidence" \
            "Independently inspect profile and Kanban evidence and record limitations." \
            quality-review epic260-review \
            | tee "$EVIDENCE_DIR/create-review.txt"

          "$HERMES_BIN" kanban --board "$BOARD" list --json > "$EVIDENCE_DIR/tasks-initial.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path(os.environ['EVIDENCE_DIR'], 'tasks-initial.json').read_text(encoding='utf-8'))
          found = []
          def walk(value):
              if isinstance(value, dict):
                  if isinstance(value.get('title'), str) and value.get('id') is not None:
                      found.append(value)
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(data)
          by_title = {}
          for item in found:
              by_title.setdefault(item['title'], []).append(str(item['id']))
          expected = [
              'Coordinate Epic 260 runtime acceptance',
              'Inspect fleet architecture contract',
              'Produce Kanban persistence evidence',
              'Review integrated runtime evidence',
          ]
          for title in expected:
              if len(by_title.get(title, [])) != 1:
                  raise SystemExit(f'idempotency/task discovery failed for {title}: {by_title.get(title)}')
          lines = [
              f"ORCHESTRATOR_ID={by_title[expected[0]][0]}",
              f"ARCHITECTURE_ID={by_title[expected[1]][0]}",
              f"BACKEND_ID={by_title[expected[2]][0]}",
              f"REVIEW_ID={by_title[expected[3]][0]}",
          ]
          Path(os.environ['EVIDENCE_DIR'], 'task-ids.env').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          source "$EVIDENCE_DIR/task-ids.env"
          "$HERMES_BIN" kanban --board "$BOARD" link "$ARCHITECTURE_ID" "$BACKEND_ID"
          "$HERMES_BIN" kanban --board "$BOARD" link "$BACKEND_ID" "$REVIEW_ID"
          "$HERMES_BIN" kanban --board "$BOARD" list --json > "$EVIDENCE_DIR/tasks-linked.json"

      - name: Execute bounded work through named profiles
        shell: bash
        run: |
          set -euo pipefail
          source "$EVIDENCE_DIR/task-ids.env"

          "$HERMES_BIN" -p engineering-orchestrator kanban --board "$BOARD" claim "$ORCHESTRATOR_ID" \
            | tee "$EVIDENCE_DIR/claim-orchestrator.txt"
          "$HERMES_BIN" -p engineering-orchestrator kanban --board "$BOARD" complete "$ORCHESTRATOR_ID" \
            --summary "Decomposed direct runtime validation into architecture, persistence, and review tasks." \
            --result "DIRECT_PROFILE_CLI_EXECUTION" \
            | tee "$EVIDENCE_DIR/complete-orchestrator.txt"

          "$HERMES_BIN" -p solution-architecture kanban --board "$BOARD" claim "$ARCHITECTURE_ID" \
            | tee "$EVIDENCE_DIR/claim-architecture.txt"
          "$HERMES_BIN" -p solution-architecture kanban --board "$BOARD" complete "$ARCHITECTURE_ID" \
            --summary "Confirmed one orchestrator, bounded specialists, structured handoffs, and separate authority records." \
            --result "DIRECT_PROFILE_CLI_EXECUTION" \
            | tee "$EVIDENCE_DIR/complete-architecture.txt"

          "$HERMES_BIN" -p backend-platform kanban --board "$BOARD" claim "$BACKEND_ID" \
            | tee "$EVIDENCE_DIR/claim-backend.txt"
          "$HERMES_BIN" -p backend-platform kanban --board "$BOARD" complete "$BACKEND_ID" \
            --summary "Confirmed shared SQLite board persistence, idempotent task creation, dependencies, and profile-scoped claims." \
            --result "DIRECT_PROFILE_CLI_EXECUTION" \
            | tee "$EVIDENCE_DIR/complete-backend.txt"

          "$HERMES_BIN" -p quality-review kanban --board "$BOARD" claim "$REVIEW_ID" \
            | tee "$EVIDENCE_DIR/claim-review.txt"
          "$HERMES_BIN" -p quality-review kanban --board "$BOARD" complete "$REVIEW_ID" \
            --summary "Runtime mechanics passed; LLM worker execution and real messaging gateway remain unverified without provider and bot credentials." \
            --result "LIMITED_DIRECT_PROFILE_CLI_REVIEW" \
            | tee "$EVIDENCE_DIR/complete-review.txt"

          "$HERMES_BIN" kanban --board "$BOARD" list --json > "$EVIDENCE_DIR/tasks-completed.json"
          for id in "$ORCHESTRATOR_ID" "$ARCHITECTURE_ID" "$BACKEND_ID" "$REVIEW_ID"; do
            "$HERMES_BIN" kanban --board "$BOARD" show "$id" --json > "$EVIDENCE_DIR/task-${id}.json"
          done

      - name: Probe dispatcher without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          "$HERMES_BIN" kanban --board "$BOARD" create "Dispatcher worker probe" \
            --body "Attempt one actual dispatcher pass. Missing provider credentials must fail closed." \
            --assignee solution-architecture \
            --workspace scratch \
            --idempotency-key epic260-dispatch-probe \
            | tee "$EVIDENCE_DIR/create-dispatch-probe.txt"

          "$HERMES_BIN" kanban --board "$BOARD" dispatch --dry-run --max 1 --json \
            > "$EVIDENCE_DIR/dispatcher-dry-run.json" 2>&1

          set +e
          timeout 90 "$HERMES_BIN" kanban --board "$BOARD" dispatch --max 1 --failure-limit 1 --json \
            > "$EVIDENCE_DIR/dispatcher-attempt.json" 2>&1
          DISPATCH_RC=$?
          set -e
          printf '%s\n' "$DISPATCH_RC" > "$EVIDENCE_DIR/dispatcher-attempt.exit"
          "$HERMES_BIN" kanban --board "$BOARD" list --json > "$EVIDENCE_DIR/tasks-after-dispatch.json"

      - name: Generate sanitized runtime receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE_DIR'])
          home = Path(os.environ['HERMES_HOME'])

          dbs = []
          for db in sorted(home.rglob('kanban.db')):
              connection = sqlite3.connect(db)
              try:
                  tables = [row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
                  table_info = []
                  for table in tables:
                      escaped = table.replace('"', '""')
                      count = connection.execute(f'SELECT COUNT(*) FROM "{escaped}"').fetchone()[0]
                      columns = [row[1] for row in connection.execute(f'PRAGMA table_info("{escaped}")')]
                      table_info.append({'name': table, 'row_count': count, 'columns': columns})
                  dbs.append({'relative_path': str(db.relative_to(home)), 'tables': table_info})
              finally:
                  connection.close()
          (evidence / 'sqlite-summary.json').write_text(json.dumps(dbs, indent=2) + '\n', encoding='utf-8')

          files = []
          for path in sorted(home.rglob('*')):
              if path.is_file():
                  files.append({'path': str(path.relative_to(home)), 'size': path.stat().st_size})
          (evidence / 'filesystem-inventory.json').write_text(json.dumps(files, indent=2) + '\n', encoding='utf-8')

          def exit_code(name, default=None):
              path = evidence / name
              if not path.is_file(): return default
              return int(path.read_text(encoding='utf-8').strip())

          dispatch_rc = exit_code('dispatcher-attempt.exit')
          skill_rc = exit_code('skill-install.exit')
          doctor_rc = exit_code('doctor.exit')

          receipt = {
              'runtime': {
                  'type': 'ephemeral_github_actions',
                  'hermes_home_isolated': True,
                  'user_runtime_touched': False,
                  'official_source_revision': (evidence / 'hermes-source-revision.txt').read_text(encoding='utf-8').strip(),
                  'version_output': (evidence / 'version.txt').read_text(encoding='utf-8').strip(),
              },
              'profiles': {
                  'created': ['engineering-orchestrator', 'solution-architecture', 'backend-platform', 'quality-review'],
                  'unique_profile_paths': True,
                  'bundled_skills_opted_out': True,
              },
              'skill_install': 'PASS' if skill_rc == 0 else 'FAIL',
              'gateway': {
                  'status': 'NOT_RUN_NO_BOT_CREDENTIALS',
                  'specialist_tokens_configured': False,
                  'policy_check': 'PASS_NO_DEDICATED_SPECIALIST_GATEWAYS',
              },
              'kanban': {
                  'init': 'PASS',
                  'board_creation': 'PASS',
                  'idempotent_task_creation': 'PASS',
                  'dependency_links': 'PASS',
                  'named_profile_claim_and_completion': 'PASS',
                  'specialists_executed_via': 'DIRECT_PROFILE_CLI',
                  'dispatcher_dry_run': 'PASS',
                  'llm_dispatch_attempt_exit': dispatch_rc,
                  'llm_worker_execution': 'BLOCKED_OR_NOT_VERIFIED_WITHOUT_PROVIDER',
              },
              'diagnostics': {
                  'doctor_exit': doctor_rc,
                  'provider_credentials_configured': False,
              },
              'review_independence': 'LIMITED_SHARED_RUNTIME_AND_SCRIPTED_CLI',
              'acceptance_result': 'PASS_WITH_LIMITATIONS',
              'limitations': [
                  'This proves real Hermes CLI, profile, skill-install, Kanban persistence, dependency, idempotency, and profile-scoped task operations in an ephemeral runtime.',
                  'It does not prove the user local Hermes installation or existing profiles.',
                  'No real Telegram/Discord gateway was started because no bot credentials were provided.',
                  'No model credential was provided; LLM-driven dispatcher worker output is blocked or unverified.',
                  'Quality review used a separate profile but the same scripted CI runtime and therefore has limited independence.',
              ],
          }
          (evidence / 'runtime-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY

          if grep -RIlE '(sk-[A-Za-z0-9]|BOT_TOKEN=.+|API_KEY=.+|GATEWAY_RELAY_SECRET=.+)' "$EVIDENCE_DIR"; then
            echo 'Potential secret material found in evidence' >&2
            exit 1
          fi

      - name: Upload direct Hermes runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: epic-260-hermes-runtime-evidence
          path: .tmp/epic-260-hermes-runtime
          if-no-files-found: error
          retention-days: 30
