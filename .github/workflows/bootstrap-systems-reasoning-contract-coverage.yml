name: Bootstrap systems-reasoning contract coverage

on:
  push:
    branches:
      - 179-feature-systems-reasoning
    paths:
      - .github/workflows/bootstrap-systems-reasoning-contract-coverage.yml

permissions:
  contents: write

jobs:
  update-contract-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout executable adapters
        uses: actions/checkout@v4
        with:
          ref: 179-feature-systems-reasoning
          path: ai-native-skills

      - name: Checkout canonical core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          path: ai-native-core

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Regenerate contract coverage evidence
        run: >-
          python ai-native-skills/scripts/inventory-contract-coverage.py
          --root ai-native-skills
          --core-root ai-native-core

      - name: Commit generated evidence and remove bootstrap workflow
        working-directory: ai-native-skills
        run: |
          rm .github/workflows/bootstrap-systems-reasoning-contract-coverage.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/contract-coverage-discovery.yaml .github/workflows/bootstrap-systems-reasoning-contract-coverage.yml
          git commit -m 'docs: refresh contract coverage for systems-reasoning'
          git push origin HEAD:179-feature-systems-reasoning
