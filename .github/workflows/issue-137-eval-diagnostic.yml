name: Issue 137 Eval Diagnostic

on:
  push:
    branches:
      - 137-production-code-quality-baseline
    paths:
      - .github/workflows/issue-137-eval-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Capture eval validator output
        shell: bash
        run: |
          set +e
          python scripts/validate-eval-contracts.py > /tmp/issue-137-eval.log 2>&1
          status=$?
          set -e
          printf '\nvalidator_exit_status=%s\n' "$status" >> /tmp/issue-137-eval.log
      - uses: actions/upload-artifact@v7
        with:
          name: issue-137-eval-diagnostic
          path: /tmp/issue-137-eval.log
      - name: Remove diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-137-eval-diagnostic.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove issue 137 eval diagnostic'
          git push origin "HEAD:${GITHUB_REF_NAME}"
