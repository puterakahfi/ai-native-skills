name: Sync Generated Capability Metadata

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "chore/**"
      - "epic/**"
    paths:
      - "skills/**"
      - "README.md"
      - "docs/skills.md"
      - "scripts/run-eval.sh"
      - "scripts/verify-capability-inventory.py"
      - "scripts/inventory-contract-coverage.py"
      - ".github/workflows/sync-generated-capability-metadata.yml"

permissions:
  contents: write

concurrency:
  group: sync-generated-capability-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout executable repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pinned Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canonical Core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Regenerate capability inventory
        run: python scripts/verify-capability-inventory.py --write-snapshot

      - name: Regenerate contract coverage evidence
        run: >-
          python scripts/inventory-contract-coverage.py
          --root .
          --core-root .deps/ai-native-core

      - name: Commit generated metadata
        shell: bash
        run: |
          set -euo pipefail
          git add docs/capability-inventory.json docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then
            echo "Generated capability metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metadata): sync generated capability evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
