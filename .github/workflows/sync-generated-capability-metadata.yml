name: Sync Generated Capability Metadata

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "chore/**"
      - "epic/**"
    paths:
      - "skills/**"
      - "README.md"
      - "docs/skills.md"
      - "scripts/run-eval.sh"
      - "scripts/verify-capability-inventory.py"
      - "scripts/inventory-contract-coverage.py"
      - ".github/workflows/sync-generated-capability-metadata.yml"
permissions:
  contents: write
concurrency:
  group: sync-generated-capability-metadata-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Synchronize documented inventory counts
        shell: python
        run: |
          import importlib.util
          import re
          from pathlib import Path
          script = Path("scripts/verify-capability-inventory.py")
          spec = importlib.util.spec_from_file_location("capability_inventory", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          counts = module.derive_inventory()["counts"]
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text, n = re.subn(r"\*\*\d+ skills · \d+ workflows · \d+ meta-skills\*\*", f"**{counts['skill']} skills · {counts['workflow']} workflows · {counts['meta-skill']} meta-skills**", text, count=1)
          if n != 1: raise SystemExit("README inventory summary was not updated exactly once")
          p.write_text(text, encoding="utf-8")
          p = Path("docs/skills.md")
          text = p.read_text(encoding="utf-8")
          replacements = {r"^- `skill`: \d+$": f"- `skill`: {counts['skill']}", r"^- `workflow`: \d+$": f"- `workflow`: {counts['workflow']}", r"^- `meta-skill`: \d+$": f"- `meta-skill`: {counts['meta-skill']}", r"^- Total executable skills: \d+$": f"- Total executable skills: {counts['total']}"}
          for pattern, replacement in replacements.items():
              text, n = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if n != 1: raise SystemExit(pattern)
          p.write_text(text, encoding="utf-8")
      - run: python scripts/verify-capability-inventory.py --write-snapshot
      - name: Generate contract coverage snapshot
        continue-on-error: true
        run: python scripts/inventory-contract-coverage.py --root . --core-root .deps/ai-native-core
      - shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/skills.md docs/capability-inventory.json docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metadata): sync generated capability evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
