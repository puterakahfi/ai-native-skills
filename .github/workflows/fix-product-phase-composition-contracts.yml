name: Fix product phase composition contracts
on:
  push:
    branches: [feat/239-complete-product-phase-compositions]
    paths:
      - scripts/fix_product_phase_composition_contracts.py
      - .github/workflows/fix-product-phase-composition-contracts.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/239-complete-product-phase-compositions
      - run: python3 scripts/fix_product_phase_composition_contracts.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(product): align composition contracts and coverage'
          git push
