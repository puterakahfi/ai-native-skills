name: Product Image Binary Fixtures

on:
  pull_request:
    paths:
      - "scripts/validate-product-image-fixtures.py"
      - "validation/product-image-production/**"
      - "docs/receipts/epic-140-creative-production-validation.json"
      - "docs/receipts/epic-140-integrated-acceptance.json"
      - ".github/workflows/product-image-binary-fixtures.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/validate-product-image-fixtures.py"
      - "validation/product-image-production/**"
      - "docs/receipts/epic-140-creative-production-validation.json"
      - "docs/receipts/epic-140-integrated-acceptance.json"
      - ".github/workflows/product-image-binary-fixtures.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout executable repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository validator dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" jsonschema

      - name: Resolve pinned canonical Core revision
        id: core-ref
        shell: bash
        run: |
          set -euo pipefail
          core_ref="$(sed -n 's/^CORE_REF="\(.*\)"/\1/p' scripts/run-eval.sh)"
          test -n "$core_ref"
          echo "ref=$core_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canonical Core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: .deps/ai-native-core

      - name: Compile validation and repository tooling
        run: |
          python -m py_compile \
            scripts/validate-product-image-fixtures.py \
            scripts/validate-design-gate-registry.py \
            scripts/validate-eval-contracts.py \
            scripts/validate-skill-packs.py \
            scripts/verify-capability-inventory.py \
            scripts/validate-contract-coverage.py \
            tests/test_validate_skill_packs.py \
            tests/test_contract_exemptions.py
          bash -n scripts/run-eval.sh

      - name: Validate deterministic product-image fixtures
        run: |
          python scripts/validate-product-image-fixtures.py \
            --manifest validation/product-image-production/fixtures/manifest.json \
            --report /tmp/product-image-validation.json \
            --compare docs/receipts/epic-140-creative-production-validation.json

      - name: Validate repository eval and design-gate contracts
        run: |
          python scripts/validate-design-gate-registry.py
          python scripts/validate-eval-contracts.py \
            --write-smoke-outputs .tmp/eval-smoke-outputs

      - name: Validate capability inventory and skill packs
        run: |
          python scripts/verify-capability-inventory.py
          python -m unittest tests/test_validate_skill_packs.py
          python scripts/validate-skill-packs.py

      - name: Validate repository contract coverage
        run: |
          python scripts/validate-contract-coverage.py \
            --root . \
            --core-root .deps/ai-native-core
          python -m unittest discover -s tests -p 'test_contract_exemptions.py' -v

      - name: Stage production skill adapters
        run: |
          rm -rf .tmp/adapter-repo
          mkdir -p .tmp/adapter-repo
          cp -R skills .tmp/adapter-repo/skills

      - name: Validate adapter paths and pinned versions
        shell: bash
        run: |
          cd .tmp/adapter-repo
          bash "$GITHUB_WORKSPACE/.deps/ai-native-core/scripts/validate-implements.sh" \
            "$GITHUB_WORKSPACE/.deps/ai-native-core"

      - name: Validate Core conformance migration state
        run: |
          rm -rf .tmp/conformance
          python .deps/ai-native-core/scripts/validate-conformance.py \
            .deps/ai-native-core \
            .tmp/adapter-repo \
            --mode migration \
            --output-dir .tmp/conformance \
            --format json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('.tmp/conformance/repository-summary.json').read_text(encoding='utf-8')
          )['conformance_report']
          summary = report['summary']
          print(json.dumps(summary, indent=2))
          if summary['errors'] != 0:
              raise SystemExit(f"Explicit conformance errors: {summary['errors']}")
          if summary['partial'] != 0:
              raise SystemExit(f"Unexpected partial declarations: {summary['partial']}")
          PY

      - name: Validate contracts with canonical Core runner
        env:
          SKILL_EVAL_TESTS_DIR: ${{ github.workspace }}/contracts/tests
        run: |
          python .deps/ai-native-core/scripts/run-eval.py \
            --all \
            --validate-tests

      - name: Verify repository wrapper integration
        env:
          AI_NATIVE_CORE_DIR: ${{ github.workspace }}/.deps/ai-native-core
        run: bash scripts/run-eval.sh --all --validate-tests

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-image-binary-validation-${{ github.run_id }}
          path: |
            /tmp/product-image-validation.json
            .tmp/conformance/repository-summary.json
          if-no-files-found: warn
