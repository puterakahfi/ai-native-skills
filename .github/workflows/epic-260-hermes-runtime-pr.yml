name: Epic 260 Hermes Runtime PR

on:
  pull_request:
    branches:
      - 260-hermes-agent-fleet-bootstrap
    paths:
      - .github/workflows/epic-260-hermes-runtime-pr.yml
      - .github/workflows/epic-260-hermes-runtime-acceptance.yml
      - scripts/run-hermes-fleet-runtime-acceptance.sh
      - skills/hermes-agent-fleet-bootstrap/**
      - docs/hermes-agent-fleet-bootstrap-*.md

permissions:
  contents: read

jobs:
  runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_HOME: ${{ runner.temp }}/epic-260-hermes-home
      HERMES_INSTALL_DIR: ${{ runner.temp }}/epic-260-hermes-install
      BOARD: epic-260-runtime-validation
      EVIDENCE_DIR: ${{ github.workspace }}/.tmp/epic-260-hermes-runtime

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workflow harness dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Execute runtime acceptance specification
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/epic-260-hermes-runtime-acceptance.yml').read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['runtime-acceptance']['steps']
          env = os.environ.copy()
          github_env = Path(env['GITHUB_ENV'])
          github_path = Path(env['GITHUB_PATH'])

          def line_count(path):
              if not path.exists():
                  return 0
              return len(path.read_text(encoding='utf-8').splitlines())

          for step in steps:
              script = step.get('run')
              if not script:
                  continue
              name = step.get('name', 'unnamed runtime step')
              print(f'::group::{name}')
              env_before = line_count(github_env)
              path_before = line_count(github_path)
              shell = step.get('shell', 'bash')
              command = ['python', '-c', script] if shell == 'python' else ['bash', '-euo', 'pipefail', '-c', script]
              result = subprocess.run(command, env=env, text=True)
              print('::endgroup::')
              if result.returncode != 0:
                  raise SystemExit(f'{name} failed with exit {result.returncode}')

              if github_env.exists():
                  for line in github_env.read_text(encoding='utf-8').splitlines()[env_before:]:
                      if '=' in line and not line.startswith('<<'):
                          key, value = line.split('=', 1)
                          env[key] = value
              if github_path.exists():
                  paths = github_path.read_text(encoding='utf-8').splitlines()[path_before:]
                  if paths:
                      env['PATH'] = os.pathsep.join(paths + [env.get('PATH', '')])

      - name: Upload direct Hermes runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-260-hermes-runtime-evidence
          path: .tmp/epic-260-hermes-runtime
          if-no-files-found: warn
          retention-days: 30
