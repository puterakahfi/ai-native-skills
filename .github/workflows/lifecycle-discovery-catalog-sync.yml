name: Lifecycle Discovery Catalog Sync

on:
  push:
    branches:
      - 246-lifecycle-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'sync lifecycle discovery catalog')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 246-lifecycle-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add approved facade discovery classifications
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('catalog/capability-discovery/classifications.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          groups = {group['id']: group for group in data['classification_groups']}

          operations = groups['operations-reliability']
          if 'maintenance-case' not in operations['capabilities']:
              operations['capabilities'].append('maintenance-case')
              operations['capabilities'].sort()
          operations.setdefault('overrides', {})['maintenance-case'] = {
              'domains': ['product', 'engineering', 'operations'],
              'lifecycle_stages': ['discover', 'plan', 'operate', 'learn'],
              'concerns': ['workflow-routing', 'incident-management', 'reliability', 'documentation', 'governance'],
              'ecosystems': ['technology-agnostic'],
          }

          governance = groups['governance-delivery']
          if 'documentation-assurance' not in governance['capabilities']:
              governance['capabilities'].append('documentation-assurance')
              governance['capabilities'].sort()
          governance.setdefault('overrides', {})['documentation-assurance'] = {
              'domains': ['engineering', 'governance', 'developer-experience'],
              'lifecycle_stages': ['plan', 'build', 'verify', 'release', 'operate'],
              'concerns': ['documentation', 'review', 'governance', 'developer-experience'],
              'ecosystems': ['technology-agnostic'],
          }

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Validate discovery and generate published catalog
        run: |
          python3 scripts/verify-capability-inventory.py
          python3 scripts/verify-capability-discovery.py
          python3 -m unittest scripts/tests/test_build_published_capability_catalog.py
          python3 scripts/build-published-capability-catalog.py --write --source-revision "$GITHUB_SHA"
          python3 scripts/build-published-capability-catalog.py --check
      - name: Commit generated catalog inputs and artifact
        run: |
          if git diff --quiet -- catalog/capability-discovery/classifications.json catalog/published/capability-catalog.json; then
            echo 'Discovery and published catalog already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/capability-discovery/classifications.json catalog/published/capability-catalog.json
          git commit -m 'chore(catalog): sync lifecycle discovery catalog'
          git push origin HEAD:246-lifecycle-completion
