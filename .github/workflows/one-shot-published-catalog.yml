name: One-shot Published Catalog

on:
  push:
    branches:
      - 204-published-capability-catalog-v2

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 204-published-capability-catalog-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest scripts/tests/test_build_published_capability_catalog.py
      - run: python3 scripts/build-published-capability-catalog.py --write --source-revision "$(git rev-parse HEAD)"
      - run: python3 scripts/build-published-capability-catalog.py --check
      - name: Commit generated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add catalog/published/capability-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(catalog): publish capability catalog'
          git push "https://x-access-token:${GH_TOKEN}@github.com/puterakahfi/ai-native-skills.git" HEAD:204-published-capability-catalog-v2
