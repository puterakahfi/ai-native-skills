name: Repository Stack Conformance

on:
  pull_request:
    paths:
      - "contracts/fixtures/repository-stack-conformance/**"
      - "contracts/tests/architecture-review.test.yaml"
      - "scripts/run-eval.sh"
      - "scripts/run-stack-conformance-eval.sh"
      - ".github/workflows/repository-stack-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout executable skills
        uses: actions/checkout@v4

      - name: Checkout pinned canonical core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          ref: 27b542c142fcbd9a7a5ad709a97489dbf190d0b0
          path: ai-native-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependency
        run: python -m pip install PyYAML

      - name: Run repository stack-conformance fixtures
        env:
          AI_NATIVE_CORE_DIR: ${{ github.workspace }}/ai-native-core
        run: ./scripts/run-stack-conformance-eval.sh
