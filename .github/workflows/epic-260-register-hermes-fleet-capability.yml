name: Register Hermes Fleet Capability

on:
  push:
    branches:
      - test/264-fleet-validators-evals
    paths:
      - .github/workflows/epic-260-register-hermes-fleet-capability.yml

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Register discovery classification and topics
        shell: python
        run: |
          import json
          from pathlib import Path

          capability = "hermes-agent-fleet-bootstrap"

          classifications_path = Path("catalog/capability-discovery/classifications.json")
          classifications = json.loads(classifications_path.read_text(encoding="utf-8"))
          groups = {group["id"]: group for group in classifications["classification_groups"]}
          group = groups["ai-agent-systems"]
          if capability not in group["capabilities"]:
              group["capabilities"].append(capability)
              group["capabilities"].sort()
          group.setdefault("overrides", {})[capability] = {
              "domains": ["ai-systems", "developer-experience", "governance"],
              "lifecycle_stages": ["plan", "build", "verify"],
              "concerns": ["workflow-routing", "implementation", "context", "developer-experience", "governance"],
              "ecosystems": ["ai-agent-runtime"],
          }
          classifications_path.write_text(
              json.dumps(classifications, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          topics_path = Path("catalog/capability-discovery/topics.json")
          topics = json.loads(topics_path.read_text(encoding="utf-8"))
          target_topics = {"agent-workflows", "ai-agent-systems", "developer-experience"}
          for topic in topics["topics"]:
              if topic["id"] in target_topics and capability not in topic["capabilities"]:
                  topic["capabilities"].append(capability)
          topics_path.write_text(
              json.dumps(topics, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

      - name: Verify discovery and build published catalog
        run: |
          python3 scripts/verify-capability-inventory.py
          python3 scripts/verify-capability-discovery.py
          python3 scripts/build-published-capability-catalog.py
          python3 -m unittest scripts/tests/test_build_published_capability_catalog.py

      - name: Commit generated catalog and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/epic-260-register-hermes-fleet-capability.yml
          git add catalog/capability-discovery/classifications.json \
                  catalog/capability-discovery/topics.json \
                  catalog/published/capability-catalog.json \
                  .github/workflows/epic-260-register-hermes-fleet-capability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): register hermes-agent-fleet-bootstrap"
          git push origin "HEAD:${GITHUB_REF_NAME}"
