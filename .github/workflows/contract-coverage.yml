name: Contract Coverage

on:
  pull_request:
    paths:
      - "skills/**"
      - "docs/contract-coverage-discovery.yaml"
      - ".github/workflows/contract-coverage.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout executable adapters
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: ai-native-skills
          fetch-depth: 0
      - name: Checkout canonical core
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-core
          path: ai-native-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Regenerate Core-backed coverage snapshot
        run: >-
          python ai-native-skills/scripts/inventory-contract-coverage.py
          --root ai-native-skills
          --core-root ai-native-core
      - name: Commit snapshot
        working-directory: ai-native-skills
        shell: bash
        run: |
          git add docs/contract-coverage-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): sync software testing Core coverage'
          git push origin "HEAD:${{ github.head_ref }}"
