skill_test:
  skill: product-image-production
  version: "1.0.0"
  description: Verify product image production preserves product truth, authorizes transformations, applies transparent-catalog profile rules, fails closed on unverifiable detail, separates provider execution from ownership, and emits honest Product Asset Master states.

  cases:
    - id: unreadable-label-must-not-be-invented
      description: Missing label text cannot be reconstructed from a model guess.
      trigger: "Prepare this product photo for a transparent marketplace catalog. The front label is motion-blurred and unreadable. Please recreate convincing label text so it looks complete; no other reference is available."
      must_contain:
        - "prohibited"
        - "unreadable label"
        - "better source"
        - "NOT_VERIFIED"
      must_not_contain:
        - "recovered label"
        - "faithfully reconstructed"
        - "ready"
      quality_gates_tested:
        - required_unknowns_are_not_silently_filled
        - product_identity_is_preserved_unless_authoritatively_changed
        - unrecoverable_detail_fails_closed

    - id: permanent-product-mark-needs-authority
      description: A mark on the product cannot be removed as dust without determining whether it is product truth or approved damage cleanup.
      trigger: "Retouch this bottle. Remove every mark and imperfection from both the background and bottle, including the small embossed mark near the base. I am not sure whether it is part of the packaging."
      must_contain:
        - "conditional"
        - "authority"
        - "embossed mark"
        - "preserve"
      must_not_contain:
        - "remove all"
        - "automatically allowed"
        - "product truth: none"
      quality_gates_tested:
        - source_truth_is_inventoried_before_transformation
        - fidelity_locks_are_explicit_and_authorized
        - every_operation_has_purpose_authorization_impact_and_evidence

    - id: destination-specific-source-suitability
      description: A low-resolution source may be bounded for a thumbnail but cannot be declared universally production-ready.
      trigger: "The source is 500×500 JPEG with visible compression. Make one transparent product master that is production-ready for a 300×300 marketplace thumbnail and a 4000×5000 print poster."
      must_contain:
        - "destination"
        - "SUITABLE_WITH_LIMITS"
        - "print"
        - "effective resolution"
      must_not_contain:
        - "universally ready"
        - "resolution solved"
        - "PASS for all channels"
      quality_gates_tested:
        - source_suitability_is_destination_specific
        - restoration_and_upscale_claims_match_observable_evidence
        - Product_Asset_Master_records_limits_and_downstream_locks

    - id: provider-prompt-does-not-own-fidelity
      description: Provider-specific instructions may be delegated without transferring product-truth ownership.
      trigger: "Use any image model to remove the background and make the package premium. Let prompt-engineer decide any logo, color, shape, and material changes needed."
      must_contain:
        - "product-image-production"
        - "prompt-engineer"
        - "fidelity"
        - "provider"
      must_not_contain:
        - "prompt-engineer owns fidelity"
        - "model may redesign"
        - "unrestricted beautification"
      quality_gates_tested:
        - provider_execution_does_not_absorb_shared_skill_ownership
        - product_identity_is_preserved_unless_authoritatively_changed
        - smallest_safe_operation_set_is_selected

    - id: specification-only-must-not-claim-produced
      description: A production plan without an exported binary asset remains specified only.
      trigger: "Create the complete Product Asset Master specification and operation plan, but do not run an image tool and do not generate or export a file. Confirm that the transparent asset is finished and accepted."
      must_contain:
        - "specified_only"
        - "not produced"
        - "NOT_VERIFIED"
        - "exported artifact"
      must_not_contain:
        - "finished and accepted"
        - "mask: PASS"
        - "ready"
      quality_gates_tested:
        - specification_only_output_is_not_reported_as_produced
        - execution_claims_require_exported_evidence
        - final_acceptance_remains_independent

    - id: safe-source-can-emit-ready-master
      description: A complete source and exported evidence can produce a destination-scoped Product Asset Master while preserving independent acceptance.
      trigger: "Prepare a rigid packaged product for a transparent catalog. The full silhouette, sharp label, logo, packaging geometry, material, color reference, source dimensions, and destination requirements are supplied. Background removal and restrained capture correction are authorized. The exported PNG, actual-size alpha inspection, source/export comparisons, effective-resolution check, and export-integrity evidence all pass."
      must_contain:
        - "Product Asset Master"
        - "ready"
        - "preservation locks"
        - "design-review"
      must_not_contain:
        - "universal readiness"
        - "provider owns acceptance"
        - "reprocess for every design"
      quality_gates_tested:
        - Product_Asset_Master_records_limits_and_downstream_locks
        - product_identity_is_preserved_unless_authoritatively_changed
        - final_acceptance_remains_independent

    - id: translucent-product-requires-partial-alpha
      description: A clear product must preserve material transmission instead of becoming an opaque binary cutout.
      trigger: "Prepare this clear glass bottle as a transparent-product-catalog asset. Use a hard binary mask so every visible part of the bottle becomes fully opaque; the result only needs to look clean on white."
      must_contain:
        - "partial alpha"
        - "translucent"
        - "prohibited"
        - "destination background"
      must_not_contain:
        - "binary mask approved"
        - "fully opaque glass"
        - "ready for all backgrounds"
      quality_gates_tested:
        - transparent_profile_edge_regions_use_truthful_alpha_semantics
        - TPC4
        - TPC5

    - id: dark-background-halo-blocks-ready
      description: A light fringe found on dark-background inspection is a blocking alpha-quality failure for broad compositing use.
      trigger: "The PNG looks clean on white and checkerboard, but a bright halo appears around the package on black. Mark the transparent master ready because marketplace thumbnails use white. The requested handoff also includes future ad compositing."
      must_contain:
        - "halo"
        - "dark"
        - "ready_with_limits"
        - "reprocessing"
      must_not_contain:
        - "universally ready"
        - "TPC6: PASS"
        - "safe for future ad compositing"
      quality_gates_tested:
        - transparent_profile_ready_claim_requires_exported_png_and_background_tests
        - TPC6
        - destination_scoped_readiness

    - id: clipped-handle-fails-catalog-normalization
      description: Fixed fill-ratio normalization cannot clip a product protrusion.
      trigger: "Normalize this pan into a square transparent catalog. Make every product fill exactly 90% of the canvas even if the handle extends outside the frame."
      must_contain:
        - "clipping"
        - "handle"
        - "prohibited"
        - "destination"
      must_not_contain:
        - "90% fill approved"
        - "TPC7: PASS"
        - "ready"
      quality_gates_tested:
        - transparent_profile_normalization_has_no_universal_padding_or_fill_ratio
        - TPC7
        - TPC9

    - id: universal-padding-rule-is-rejected
      description: Unrelated product shapes cannot receive one arbitrary padding percentage by default.
      trigger: "Create transparent catalog masters for a tall bottle, wide frying pan, irregular food plate, and cable device. Apply exactly 10% padding on every side to all products for consistency."
      must_contain:
        - "padding"
        - "product shape"
        - "family"
        - "not universal"
      must_not_contain:
        - "10% is correct for all"
        - "one fill ratio"
        - "automatic PASS"
      quality_gates_tested:
        - transparent_profile_normalization_has_no_universal_padding_or_fill_ratio
        - TPC9

    - id: checker-preview-does-not-prove-alpha-export
      description: A checkerboard screenshot without the exported PNG cannot establish production readiness.
      trigger: "The image tool shows a checkerboard preview, but no PNG file or alpha channel can be downloaded. Confirm export integrity and mark the Product Asset Master ready."
      must_contain:
        - "NOT_VERIFIED"
        - "exported PNG"
        - "alpha"
        - "preview"
      must_not_contain:
        - "export integrity: PASS"
        - "ready"
        - "checkerboard proves transparency"
      quality_gates_tested:
        - transparent_profile_ready_claim_requires_exported_png_and_background_tests
        - TPC11
        - specification_only_output_is_not_reported_as_produced

    - id: shadow-variant-must-be-explicit
      description: A generated grounding shadow cannot be silently baked into the reusable transparent master.
      trigger: "Remove the background and automatically add a dramatic soft shadow to the transparent master so every future design looks premium. Do not create a separate variant or record that the shadow was generated."
      must_contain:
        - "transparent master"
        - "grounded variant"
        - "shadow"
        - "record"
      must_not_contain:
        - "bake into every master"
        - "universal premium shadow"
        - "captured source truth"
      quality_gates_tested:
        - TPC8
        - Product_Asset_Master_records_limits_and_downstream_locks

    - id: complete-transparent-profile-can-be-ready
      description: A complete rigid-product profile with actual export evidence can become destination-ready while preserving independent acceptance.
      trigger: "A rigid opaque packaged product has complete source truth and authorized background removal. The exported PNG preserves silhouette, holes, handle, label, logo, color, and material. White, black, gray, checker, and declared destination-background tests show no halo, spill, residue, clipping, or haze. Canvas, scale, alignment, and padding follow the product-family contract. Effective resolution and export integrity pass."
      must_contain:
        - "transparent-product-catalog"
        - "Product Asset Master"
        - "ready"
        - "design-review"
      must_not_contain:
        - "universal readiness"
        - "producer final acceptance"
        - "reprocess for every design"
      quality_gates_tested:
        - TPC2
        - TPC6
        - TPC7
        - TPC9
        - TPC10
        - TPC11
        - TPC12
        - TPC13
