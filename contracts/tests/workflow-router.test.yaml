skill_test:
  skill: workflow-router
  version: 1.7.0
  description: Verify lifecycle selection remains primary while commercial-production, product-image, design-domain, platform-specialist, delivery-topology, and task-continuity overlays load the correct capabilities.
  cases:
  - id: chatgpt-app-from-zero-routes-product-workflow-plus-specialist
    description: A ChatGPT App product from zero uses the existing product lifecycle plus the platform specialist.
    trigger: Build a ChatGPT App from zero using OpenAI Apps SDK and MCP. Belum ada PRD atau technical spec.
    must_contain: [product-development-workflow, chatgpt-app-development, platform specialist, discovery]
    must_not_contain: [chatgpt-app-workflow, new-feature-workflow as primary, start implementation immediately]
    quality_gates_tested: [product_from_zero_lifecycle_preserved, platform_specialist_overlay, no_duplicate_platform_workflow]

  - id: existing-product-chatgpt-integration-routes-feature-plus-specialist
    description: Adding ChatGPT integration to an existing product remains a feature lifecycle.
    trigger: Produk dan PRD sudah ada. Tambahkan Apps SDK/MCP integration supaya capability existing bisa dipakai di ChatGPT.
    must_contain: [new-feature-workflow, chatgpt-app-development, platform specialist]
    must_not_contain: [product-development-workflow as primary, chatgpt-app-workflow]
    quality_gates_tested: [existing_product_feature_route_preserved, platform_specialist_overlay]

  - id: natural-fresh-chat-continuation-loads-continuity-before-governing-lifecycle
    description: A natural fresh-chat continuation loads continuity as a verification overlay without replacing the feature lifecycle.
    trigger: Chat ini sudah kepanjangan. Pindah ke chat baru dan lanjutkan feature yang sedang dikerjakan dari posisi terakhir, tetapi cek dulu issue, branch, PR, dan hasil validasinya.
    must_contain:
    - task-continuity
    - authoritative sources
    - continuity validation
    - new-feature-workflow
    - preserve the governing lifecycle
    - no execution before resume verdict
    must_not_contain:
    - continue from memory
    - task-continuity replaces new-feature-workflow
    - start implementation immediately
    quality_gates_tested:
    - route_before_execution
    - cross_session_continuity_overlay
    - governing_lifecycle_preserved

  - id: audit-only-routes-to-design-audit
    description: Audit-only intent must not start redesign production.
    trigger: Audit dashboard ini dan jelaskan apa yang salah. Jangan ubah desain atau source code.
    must_contain: [DESIGN AUDIT, design-audit, report only]
    must_not_contain: [Starting redesign-workflow, PRODUCTION]
    quality_gates_tested: [audit_is_not_redesign, route_before_execution]

  - id: known-tabs-failure-routes-to-refinement
    description: A known narrow failure with preservation constraints belongs to design refinement.
    trigger: Perbaiki hanya tabs category yang overlap di tablet. Pertahankan direction, layout, dan komponen lain yang sudah benar.
    design_gate_ids: [I4]
    must_contain: [design-refinement, targeted, preserve]
    must_not_contain: [redesign-workflow, replace visual direction]
    quality_gates_tested: [known_failure_routes_to_refinement, preserve_scope]

  - id: broad-direction-change-routes-to-redesign
    description: Broad structural and visual-direction replacement belongs to redesign workflow.
    trigger: Redesign landing page ini. Direction, hierarchy, macrostructure, dan visual language sekarang salah dan perlu diganti.
    must_contain: [redesign-workflow, broad, direction]
    must_not_contain: [design-refinement]
    quality_gates_tested: [broad_direction_routes_to_redesign]

  - id: logo-audit-routes-to-brand-identity-review
    description: Identity audit uses the installed specialist adapter and BI namespace.
    trigger: Audit logo identity system ini untuk production readiness. brand-identity-review tersedia.
    design_gate_ids: [BI1, BI2, BI5, BI7, BI11, BI16]
    must_contain: [design-audit, design-review, brand-identity-review, ADAPTER_COVERED, BI]
    must_not_contain: [built-in interactive, LIMITED REVIEW]
    quality_gates_tested: [design_domain_resolution, installed_domain_adapter_selected, unsupported_domain_not_forced_through_ui_review]

  - id: logo-audit-without-adapter-is-limited
    description: Missing identity adapter limits the review rather than falling back to UI gates.
    trigger: Audit logo identity system ini, tetapi brand-identity-review tidak tersedia.
    must_contain: [design-audit, brand-identity-review, LIMITED REVIEW]
    must_not_contain: [built-in interactive, ADAPTER_COVERED]
    quality_gates_tested: [missing_domain_adapter_limits_verdict, no_ui_fallback_for_identity_domain]

  - id: router-clarifies-ambiguity-and-preserves-approval-policy
    description: Route an ambiguous request that may trigger post-fix learning and repository writes.
    trigger: Apply workflow-router to a realistic context, routing, profile, planning, evaluation, or maintenance task and report the contract-backed result.
    must_contain:
    - ambiguous_requests_must_be_clarified_not_assumed
    - post_fix_learning_route_must_not_bypass_repository_write_or_approval_policy
    - workflow_selection
    - skill_load_order
    - routing_rationale
    - ambiguity_resolution
    - post_fix_learning_route
    - user_request
    must_not_contain: [guess the ambiguous lifecycle, bypass repository approval]
    quality_gates_tested: [ambiguous_requests_must_be_clarified_not_assumed, post_fix_learning_route_must_not_bypass_repository_write_or_approval_policy]

  - id: multi-slice-product-loads-delivery-topology
    description: A dependent broad capability keeps its lifecycle and loads delivery decomposition before Git execution.
    trigger: Add a multi-slice ChatGPT App P0 to an existing product; slices are dependent and targets are undefined.
    must_contain: [new-feature-workflow, chatgpt-app-development, delivery-work-breakdown, epic]
    must_not_contain: [every child PR targets main, default branch decides target]
    quality_gates_tested: [existing_product_feature_route_preserved, platform_specialist_overlay, release_unit_classified_before_repository_execution]

  - id: natural-member-management-routes-feature-lifecycle-plus-delivery-topology
    description: A broad existing-product capability naturally loads delivery decomposition before any issue, branch, or PR execution.
    trigger: VisualMate already exists. Add Member Management covering member lifecycle, SUPERADMIN and MEMBER roles, product entitlement, invitation and administration, server-enforced authorization, responsive UI, safe mutations, replaceable authority adapters, audit evidence, and final product acceptance. Start implementing it.
    must_contain:
    - new-feature-workflow
    - delivery-work-breakdown
    - 'release_unit: epic'
    - parent epic
    - before repository execution
    must_not_contain:
    - one ordinary feature task
    - start implementation immediately
    - create child branches before classification
    - default branch decides target
    quality_gates_tested:
    - existing_product_feature_route_preserved
    - release_unit_classified_before_repository_execution
    - no_execution_before_routing_confirmed

  - id: raw-product-photo-new-ad-routes-commercial-production-plus-image-specialist
    description: A net-new commercial ad from a raw product source uses the commercial lifecycle and prepares the product before composition.
    trigger: Buat Instagram ads baru dari foto mentah botol ini. Retouch, hapus background, susun headline, layout, dan export final.
    must_contain:
    - commercial-creative-production
    - product-image-production
    - Product Asset Master
    - master-design
    - design-review
    must_not_contain:
    - raw product source directly to final design
    - prompt-engineer as fidelity owner
    - redesign-workflow as primary
    quality_gates_tested:
    - commercial_production_is_distinguished_from_asset_preparation_prompt_audit_refinement_and_redesign
    - raw_product_source_cannot_bypass_required_product_image_production
    - exactly_one_primary_lifecycle_or_capability

  - id: standalone-transparent-product-request-routes-specialist-only
    description: A request for one reusable transparent asset does not load the full commercial lifecycle.
    trigger: Hapus background foto produk ini dan berikan transparent PNG master untuk dipakai berulang. Jangan buat banner atau iklan.
    must_contain:
    - product-image-production
    - standalone
    - Product Asset Master
    must_not_contain:
    - commercial-creative-production as primary
    - master-design required
    - campaign composition
    quality_gates_tested:
    - commercial_production_is_distinguished_from_asset_preparation_prompt_audit_refinement_and_redesign
    - exactly_one_primary_lifecycle_or_capability

  - id: prepared-master-new-banner-reuses-approved-asset
    description: A verified destination-compatible Product Asset Master enters commercial production without repeated image processing.
    trigger: Buat marketplace banner baru menggunakan Product Asset Master PAM-24. Variant transparan sudah approved untuk channel, ukuran, background, dan shadow mode ini.
    must_contain:
    - commercial-creative-production
    - reuse
    - approved Product Asset Master
    - master-design
    must_not_contain:
    - remove background again
    - regenerate product
    - reprocess raw source
    quality_gates_tested:
    - verified_Product_Asset_Master_can_be_reused_without_unnecessary_reprocessing
    - exactly_one_primary_lifecycle_or_capability

  - id: existing-commercial-poster-broad-change-remains-redesign
    description: Broad changes to an existing commercial artifact remain redesign.
    trigger: Redesign poster existing ini. Ganti campaign concept, hierarchy, composition, type system, dan visual language, tetapi pertahankan product truth.
    must_contain:
    - redesign-workflow
    - existing artifact
    - broad direction
    - product-image-production
    must_not_contain:
    - commercial-creative-production as primary
    - net-new artifact
    quality_gates_tested:
    - commercial_production_is_distinguished_from_asset_preparation_prompt_audit_refinement_and_redesign
    - broad_direction_routes_to_redesign

  - id: known-product-halo-remains-targeted-refinement
    description: A verified narrow asset defect preserves the refinement lifecycle while loading the causal image specialist.
    trigger: Fix hanya halo pada edge produk transparan ini. Direction, layout, copy, warna produk, bentuk, dan shadow mode sudah approved dan harus dipertahankan.
    must_contain:
    - design-refinement
    - product-image-production
    - targeted
    - preserve
    must_not_contain:
    - redesign-workflow
    - commercial-creative-production as primary
    - rebuild everything
    quality_gates_tested:
    - targeted_design_gate_fixes_must_route_to_design_refinement
    - raw_product_source_cannot_bypass_required_product_image_production
