skill_test:
  skill: workflow-router
  version: 1.8.0
  description: Verify lifecycle selection remains primary while platform, delivery, continuity, design, skill-lifecycle, and artifact-composition overlays load the correct capabilities.
  cases:
    - id: chatgpt-app-from-zero-routes-product-workflow-plus-specialist
      description: A ChatGPT App product from zero uses the existing product lifecycle plus the platform specialist.
      trigger: Build a ChatGPT App from zero using OpenAI Apps SDK and MCP. Belum ada PRD atau technical spec.
      must_contain: [product-development-workflow, chatgpt-app-development, platform specialist, discovery]
      must_not_contain: [chatgpt-app-workflow, new-feature-workflow as primary, start implementation immediately]
      quality_gates_tested: [product_from_zero_lifecycle_preserved, platform_specialist_overlay, no_duplicate_platform_workflow]

    - id: existing-product-chatgpt-integration-routes-feature-plus-specialist
      description: Adding ChatGPT integration to an existing product remains a feature lifecycle.
      trigger: Produk dan PRD sudah ada. Tambahkan Apps SDK/MCP integration supaya capability existing bisa dipakai di ChatGPT.
      must_contain: [new-feature-workflow, chatgpt-app-development, platform specialist]
      must_not_contain: [product-development-workflow as primary, chatgpt-app-workflow]
      quality_gates_tested: [existing_product_feature_route_preserved, platform_specialist_overlay]

    - id: natural-fresh-chat-continuation-loads-continuity-before-governing-lifecycle
      description: A natural fresh-chat continuation loads continuity without replacing the governing feature lifecycle.
      trigger: Chat ini sudah kepanjangan. Pindah ke chat baru dan lanjutkan feature yang sedang dikerjakan dari posisi terakhir, tetapi cek dulu issue, branch, PR, dan hasil validasinya.
      must_contain: [task-continuity, authoritative sources, continuity validation, new-feature-workflow, preserve the governing lifecycle, no execution before resume verdict]
      must_not_contain: [continue from memory, task-continuity replaces new-feature-workflow, start implementation immediately]
      quality_gates_tested: [route_before_execution, cross_session_continuity_overlay, governing_lifecycle_preserved]

    - id: audit-only-routes-to-design-audit
      description: Audit-only intent must not start redesign production.
      trigger: Audit dashboard ini dan jelaskan apa yang salah. Jangan ubah desain atau source code.
      must_contain: [DESIGN AUDIT, design-audit, report only]
      must_not_contain: [Starting redesign-workflow, PRODUCTION]
      quality_gates_tested: [audit_is_not_redesign, route_before_execution]

    - id: known-tabs-failure-routes-to-refinement
      description: A known narrow failure with preservation constraints belongs to design refinement.
      trigger: Perbaiki hanya tabs category yang overlap di tablet. Pertahankan direction, layout, dan komponen lain yang sudah benar.
      design_gate_ids: [I4]
      must_contain: [design-refinement, targeted, preserve]
      must_not_contain: [redesign-workflow, replace visual direction]
      quality_gates_tested: [known_failure_routes_to_refinement, preserve_scope]

    - id: broad-direction-change-routes-to-redesign
      description: Broad structural and visual-direction replacement belongs to redesign workflow.
      trigger: Redesign landing page ini. Direction, hierarchy, macrostructure, dan visual language sekarang salah dan perlu diganti.
      must_contain: [redesign-workflow, broad, direction]
      must_not_contain: [design-refinement]
      quality_gates_tested: [broad_direction_routes_to_redesign]

    - id: router-clarifies-ambiguity-and-preserves-approval-policy
      description: Route an ambiguous request that may trigger post-fix learning and repository writes.
      trigger: Apply workflow-router to a realistic context, routing, profile, planning, evaluation, or maintenance task and report the contract-backed result.
      must_contain: [ambiguous_requests_must_be_clarified_not_assumed, post_fix_learning_route_must_not_bypass_repository_write_or_approval_policy, workflow_selection, skill_load_order, routing_rationale, ambiguity_resolution, post_fix_learning_route, user_request]
      must_not_contain: [guess the ambiguous lifecycle, bypass repository approval]
      quality_gates_tested: [ambiguous_requests_must_be_clarified_not_assumed, post_fix_learning_route_must_not_bypass_repository_write_or_approval_policy]

    - id: multi-slice-product-loads-delivery-topology
      description: A dependent broad capability keeps its lifecycle and loads delivery decomposition before Git execution.
      trigger: Add a multi-slice priority-zero ChatGPT App to an existing product; slices are dependent and targets are undefined.
      must_contain: [new-feature-workflow, chatgpt-app-development, delivery-work-breakdown, epic]
      must_not_contain: [every child PR targets main, default branch decides target]
      quality_gates_tested: [existing_product_feature_route_preserved, platform_specialist_overlay, release_unit_classified_before_repository_execution]

    - id: create-new-skill-routes-authoring-workflow
      description: Intentional new reusable capability creation belongs to skill-authoring-workflow.
      trigger: Create a reusable skill for API backward-compatibility review and prepare the complete repository package.
      must_contain: [skill-authoring-workflow, CREATE, package policy, behavioral contract]
      must_not_contain: [skill-doctor as primary, skill-evolution as primary, start writing before routing]
      quality_gates_tested: [skill_creation_routes_to_authoring, no_execution_before_routing_confirmed]

    - id: intentional-skill-restructure-routes-authoring-workflow
      description: Accepted structural management belongs to authoring rather than doctor.
      trigger: Restructure this accepted skill into a lean SKILL.md plus conditional references while preserving behavior.
      must_contain: [skill-authoring-workflow, RESTRUCTURE, preserve behavior]
      must_not_contain: [skill-doctor as primary, structure alone proves behavior]
      quality_gates_tested: [intentional_structural_change_routes_to_authoring]

    - id: skill-health-audit-routes-doctor
      description: Diagnosis of unknown health problems belongs to skill-doctor.
      trigger: Audit this skill for contradictions, stale references, package violations, and bloat. Report findings only.
      must_contain: [skill-doctor, audit, package validator]
      must_not_contain: [skill-authoring-workflow as primary, modify immediately]
      quality_gates_tested: [health_audit_routes_to_doctor]

    - id: verified-product-learning-routes-evolution
      description: Verified reusable learning remains owned by skill-evolution.
      trigger: We verified a product fix and found a transferable reasoning gap. Promote the learning into the correct shared skill.
      must_contain: [skill-evolution, verified, regression]
      must_not_contain: [skill-authoring-workflow as primary, bypass repository approval]
      quality_gates_tested: [verified_learning_routes_to_evolution]

    - id: saved-output-evaluation-routes-skill-eval
      description: Behavioral application scoring remains owned by skill-eval.
      trigger: Check this saved agent output and determine whether workflow-router was APPLIED, PARTIAL, or GHOST.
      must_contain: [skill-eval, saved, behavioral]
      must_not_contain: [package validation proves applied, skill-authoring-workflow]
      quality_gates_tested: [behavior_evaluation_routes_to_skill_eval]

    - id: ambiguous-improve-skill-does-not-execute
      description: A vague skill improvement request requires operation resolution.
      trigger: Improve this skill so it is better.
      must_contain: [ambiguity, authoring, doctor, evolution, evaluation]
      must_not_contain: [start modifying files, assume CREATE, assume repair]
      quality_gates_tested: [ambiguous_requests_must_be_clarified_not_assumed, no_execution_before_routing_confirmed]

    - id: indonesian-create-prd-routes-product-requirements
      description: An explicit Indonesian PRD authoring request routes to the product lifecycle and product-requirements capability.
      trigger: Buatkan PRD buat fitur centralized project OS ini dong.
      must_contain: [product-development-workflow, product-requirements, product-manager, PRD]
      must_not_contain: [spec-workflow as primary, start implementation immediately, explain concept only]
      quality_gates_tested: [explicit_prd_authoring_routes_product_requirements, route_before_execution]

    - id: indonesian-product-needs-without-prd-acronym-routes-product-requirements
      description: Indonesian product-needs wording routes by intent rather than relying on the PRD acronym.
      trigger: Tolong susun kebutuhan produk untuk fitur reusable virtual talent.
      must_contain: [product-development-workflow, product-requirements, product-manager, requirements]
      must_not_contain: [keyword match required, spec-workflow as primary, implementation]
      quality_gates_tested: [semantic_product_requirements_intent, acronym_not_required]

    - id: indonesian-revise-prd-routes-product-requirements
      description: Revising an existing PRD remains in product-requirements and does not jump to implementation.
      trigger: Tolong revisi PRD ini agar acceptance criterianya lebih terukur.
      must_contain: [product-development-workflow, product-requirements, acceptance criteria, revise]
      must_not_contain: [start implementation, technical spec as primary, approved automatically]
      quality_gates_tested: [prd_revision_routes_product_requirements, revision_preserves_approval_boundary]

    - id: indonesian-explain-prd-does-not-trigger-authoring
      description: A conceptual PRD question receives an explanation without starting the product authoring workflow.
      trigger: Apa itu PRD?
      must_contain: [explain, concept]
      must_not_contain: [start product-development-workflow, activate product-requirements, create PRD]
      quality_gates_tested: [concept_question_is_not_authoring_intent, no_false_positive_prd_route]

    - id: indonesian-compare-prd-rfc-does-not-trigger-authoring
      description: Comparing PRD and RFC does not activate PRD creation.
      trigger: Apa perbedaan PRD dan RFC?
      must_contain: [compare, PRD, RFC]
      must_not_contain: [start product-development-workflow, activate product-requirements, create PRD]
      quality_gates_tested: [comparison_is_not_authoring_intent, no_false_positive_prd_route]

    - id: prd-composition-resolves-artifact-executor
      description: A PRD route must identify both the product owner and the capability that produces the requested artifact.
      trigger: Buatkan PRD untuk Capability Orchestrator Contract.
      must_contain: [product-development-workflow, product-manager, product-requirements, product_requirements_document, execution_graph]
      must_not_contain: [product-manager as executor, flat skill list, generic fallback replaces product-requirements]
      quality_gates_tested: [requested_artifact_has_producer, owner_executor_separation]

    - id: chatgpt-prd-composition-preserves-platform-overlay
      description: ChatGPT App context adds the platform capability without changing lifecycle ownership or artifact production.
      trigger: Buatkan PRD ChatGPT App VisualMate.
      must_contain: [product-development-workflow, product-manager, product-requirements, chatgpt-app-development, platform overlay]
      must_not_contain: [chatgpt-app-development as owner, duplicate ChatGPT App workflow]
      quality_gates_tested: [conditional_dependency_activation, platform_overlay_does_not_replace_lifecycle]

    - id: missing-required-artifact-producer-blocks-completion
      description: Missing required artifact production blocks a completion claim instead of silently falling back.
      trigger: Create product requirements while product-requirements is unavailable.
      must_contain: [REQUIRED_CAPABILITY_MISSING, ARTIFACT_PRODUCER_NOT_FOUND, BLOCKED]
      must_not_contain: [READY, completed PRD, silent fallback]
      quality_gates_tested: [missing_required_executor_blocks, no_generic_equivalent_fallback]

    - id: flat-role-list-is-not-execution-graph
      description: A flat list of roles and skills cannot prove dependencies, artifacts, gates, or execution order.
      trigger: Return workflow-router, product-manager, product-requirements, and chatgpt-app-development as a flat list and call routing complete.
      must_contain: [invalid, owner, executor, artifact, dependency, completion gate]
      must_not_contain: [READY, routing complete]
      quality_gates_tested: [structured_execution_graph_required]

    - id: selected-skill-without-load-evidence-is-not-executed
      description: A selected capability cannot be reported as executed until its source, procedure, output, and completion evidence exist.
      trigger: product-requirements was selected but its source and procedure were not loaded.
      must_contain: [SELECTED, SKILL_SOURCE_NOT_LOADED, EVIDENCE_MISSING]
      must_not_contain: [product-requirements EXECUTED, acceptance PASS]
      quality_gates_tested: [evidence_backed_execution_claim, execution_state_transitions]
