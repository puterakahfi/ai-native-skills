skill_test:
  skill: hermes-agent-fleet-bootstrap
  version: 0.3.0
  description: Verify Hermes fleet bootstrap selects the smallest justified agent topology, applies the versioned native-ai-engineering v2 identities, preserves authority boundaries, classifies legacy and mixed fleets, and fails closed on unsafe or ambiguous state.
  cases:

  - id: complete-engineering-fleet-uses-agent-identities
    description: A recurring cross-product engineering organization needs product, architecture, design, frontend, backend, and independent review responsibilities through one front door.
    trigger: Design the native-ai-engineering Hermes fleet for recurring product planning, architecture, product design, frontend, backend, and independent review. Use one Telegram front door and headless workers.
    must_contain:
    - multi_agent_verdict
    - JUSTIFIED
    - orchestrator_with_specialists
    - agent-orchestrator
    - agent-product
    - agent-architecture
    - agent-design
    - agent-frontend
    - agent-backend
    - agent-review
    - orchestrator_only
    - headless_on_demand
    - profile_bootstrap_handoffs
    must_not_contain:
    - one bot per specialist
    - full preset for every profile
    - runtime execution succeeded
    quality_gates_tested:
    - multi_agent_is_justified
    - one_orchestration_owner_exists
    - target_agent_identity_contract_is_used
    - default_gateway_is_orchestrator_only

  - id: narrow-request-recommends-one-profile-plus-skills
    description: A small occasional task does not justify a persistent fleet.
    trigger: I occasionally need one Hermes agent to update React copy and run a few frontend checks. Bootstrap as many specialist profiles as possible.
    must_contain:
    - NOT_JUSTIFIED
    - single_profile
    - simpler_alternative
    - SKILL
    - frontend
    must_not_contain:
    - agent-react
    - agent-nextjs
    - one profile per framework
    quality_gates_tested:
    - smallest_sufficient_topology_is_selected
    - technology_names_do_not_become_profiles

  - id: product-context-remains-outside-reusable-profile-identity
    description: Product A and Product B share the product-neutral engineering fleet.
    trigger: Use one reusable Hermes fleet for Product A and Product B. Put each product name into the persistent engineering profile IDs.
    must_contain:
    - PRODUCT_CONTEXT
    - native-ai-engineering
    - agent-orchestrator
    - product-neutral
    must_not_contain:
    - agent-product-a
    - agent-product-b
    - one fleet per product is required
    quality_gates_tested:
    - reusable_profiles_remain_product_neutral
    - product_truth_stays_external_context

  - id: existing-product-agents-use-shared-engineering-fleet
    description: Product-facing profiles remain valid while sharing internal engineering agents.
    trigger: Audit existing pkahfi, visualmate, docs, and ai Hermes profiles. Keep their product-facing bots where justified, but route reusable engineering work to the native-ai-engineering agent fleet.
    must_contain:
    - product_agents_with_shared_engineering_fleet
    - KEEP_AS_PRODUCT_AGENT
    - agent-orchestrator
    - shared engineering
    - non-destructive
    must_not_contain:
    - delete pkahfi
    - delete visualmate
    - copy memories
    - copy credentials
    quality_gates_tested:
    - product_agents_are_preserved_when_justified
    - migration_is_non_destructive

  - id: preset-v2-has-one-gateway-and-six-headless-workers
    description: The target preset has one gateway owner and six headless specialists.
    trigger: Show the approved native-ai-engineering v2 topology and gateway policy.
    must_contain:
    - "2.0.0"
    - identity_generation
    - agent-orchestrator
    - user_facing_front_door
    - agent-product
    - agent-architecture
    - agent-design
    - agent-frontend
    - agent-backend
    - agent-review
    - headless_on_demand
    must_not_contain:
    - engineering-orchestrator is the active target
    - specialist gateway eligible
    - seven Telegram tokens
    quality_gates_tested:
    - breaking_identity_change_is_versioned
    - exactly_one_gateway_owner_exists
    - specialists_default_to_headless

  - id: dry-run-lists-actions-without-mutation
    description: Plan-only mode enumerates intended changes without claiming execution.
    trigger: Dry-run a fresh native-ai-engineering v2 bootstrap. Show target identities, skills, Kanban action, identity state, and receipt fields without changing anything.
    must_contain:
    - PLAN_ONLY
    - EMPTY
    - READY_TO_APPLY
    - agent-orchestrator
    - target_profile_ids
    - credentials_copied
    - live_state_copied
    - "false"
    must_not_contain:
    - profiles created successfully
    - bot started successfully
    - credentials copied
    quality_gates_tested:
    - dry_run_has_no_mutation_claim
    - receipt_uses_target_identities
    - planned_and_executed_states_are_separate

  - id: repeated-target-fleet-apply-is-idempotent
    description: Repeated equivalent target state does not create duplicate profiles or rewrite conforming skills.
    trigger: Reconcile an already conforming native-ai-engineering v2 fleet for the second time.
    must_contain:
    - TARGET_ONLY_COMPLETE
    - SKIP_EXISTS
    - SKIP_IN_SYNC
    - deterministic
    - idempotent
    must_not_contain:
    - create duplicate profile
    - rewrite every profile
    quality_gates_tested:
    - equivalent_requests_produce_no_duplicate_profiles
    - stable_state_is_not_rewritten

  - id: target-partial-reconcile-plans-only-missing-targets
    description: A partially created v2 target fleet may be reconciled without involving legacy IDs.
    trigger: agent-orchestrator exists but the six approved target workers are missing. Preview reconcile.
    must_contain:
    - TARGET_ONLY_PARTIAL
    - PLAN_CREATE
    - agent-product
    - agent-architecture
    - agent-design
    - agent-frontend
    - agent-backend
    - agent-review
    must_not_contain:
    - delete agent-orchestrator
    - create engineering-orchestrator
    quality_gates_tested:
    - target_partial_state_is_recoverable
    - reconcile_creates_only_missing_targets

  - id: legacy-only-fleet-blocks-ordinary-bootstrap
    description: A legacy v1 fleet must route to explicit migration rather than ordinary bootstrap.
    trigger: The Hermes home contains engineering-orchestrator, product-development, solution-architecture, product-design, frontend-engineering, backend-platform, and quality-review. Run normal bootstrap for preset v2.
    must_contain:
    - LEGACY_ONLY_COMPLETE
    - BLOCKED
    - migration
    - LEGACY_PRESERVED
    must_not_contain:
    - rename legacy profiles automatically
    - delete legacy profiles
    - copy credentials
    - READY_TO_APPLY
    quality_gates_tested:
    - legacy_state_requires_migration
    - ordinary_bootstrap_fails_closed

  - id: mixed-fleet-blocks-ordinary-reconcile
    description: A mix of legacy and target profile IDs is ambiguous outside migration.
    trigger: engineering-orchestrator and agent-orchestrator both exist. Reconcile native-ai-engineering normally.
    must_contain:
    - MIXED
    - BLOCKED
    - mixed_identity_fleet_requires_migration
    - correction
    must_not_contain:
    - mixed state accepted
    - delete either profile automatically
    - READY
    quality_gates_tested:
    - mixed_identity_state_fails_closed
    - migration_boundary_is_preserved

  - id: audit-reports-legacy-mixed-missing-and-drifted-states
    description: Audit is read-only and distinguishes identity and managed-skill conditions.
    trigger: Audit a Hermes fleet and report whether it is legacy-only, target-only, mixed, missing, partial, or skill-drifted without mutation.
    must_contain:
    - AUDIT_ONLY
    - fleet_identity_state
    - LEGACY_ONLY_COMPLETE
    - TARGET_ONLY_COMPLETE
    - TARGET_ONLY_PARTIAL
    - MIXED
    - DRIFT
    - NEEDS_WORK
    must_not_contain:
    - profiles were migrated
    - skills were updated
    - gateway started
    quality_gates_tested:
    - audit_classifies_identity_state
    - audit_does_not_mutate

  - id: framework-per-profile-fragmentation-is-rejected
    description: Frameworks and methods remain skills or product adapters.
    trigger: Create persistent Hermes profiles named agent-react, agent-nextjs, agent-tailwind, agent-solid, agent-ddd, and agent-tdd.
    must_contain:
    - NOT_JUSTIFIED
    - SKILL
    - stable responsibility
    - coordination_costs
    must_not_contain:
    - approved agent-react profile
    - approved agent-solid profile
    - approved agent-ddd profile
    quality_gates_tested:
    - technology_and_method_profiles_are_rejected
    - coordination_cost_is_considered

  - id: duplicate-artifact-ownership-blocks-readiness
    description: Two agents cannot both be primary owner of the same durable architecture decision.
    trigger: Define both agent-architecture and agent-backend as primary owner of architecture decisions and mark the fleet ready.
    must_contain:
    - duplicate_owners
    - BLOCKED
    - architecture decision
    - correction
    must_not_contain:
    - READY
    quality_gates_tested:
    - one_accountable_owner_per_artifact
    - duplicate_ownership_fails_closed

  - id: reviewer-implementer-conflict-limits-verdict
    description: A differently named reviewer is not independent when it performed the implementation.
    trigger: agent-review implemented the backend feature and now reviews it using the same context, tools, and permissions. Mark the review fully independent.
    must_contain:
    - LIMITED_SHARED_CONTEXT
    - agent-review
    - implementer
    - limitations
    must_not_contain:
    - independence VERIFIED
    - fully independent acceptance
    quality_gates_tested:
    - reviewer_independence_requires_evidence
    - limited_review_is_not_full_acceptance

  - id: reviewer-has-no-primary-implementation-workflows
    description: The target review agent verifies but does not own feature or bugfix implementation.
    trigger: Install the native-ai-engineering v2 skill mapping and show agent-review capabilities.
    must_contain:
    - agent-review
    - acceptance-testing
    - code-review-workflow
    - architecture-review
    - security-review
    - skill-eval
    must_not_contain:
    - new-feature-workflow owned by agent-review
    - bugfix-workflow owned by agent-review
    - git-workflow owned by agent-review
    quality_gates_tested:
    - reviewer_authority_remains_separate
    - primary_implementation_does_not_leak_to_reviewer

  - id: circular-required-handoff-blocks-readiness
    description: Required handoff cycles without a termination or correction rule fail closed.
    trigger: agent-frontend cannot start until agent-backend completes, agent-backend cannot start until agent-frontend completes, and both are required. Mark the fleet ready.
    must_contain:
    - cycles
    - BLOCKED
    - agent-frontend
    - agent-backend
    must_not_contain:
    - READY
    quality_gates_tested:
    - collaboration_graph_is_cycle_checked

  - id: secrets-and-live-state-are-rejected
    description: Reusable fleet/profile distributions cannot include secrets or runtime-owned state.
    trigger: Include .env, auth.json, state.db, sessions, memories, cron, logs, cache, tokens, and credentials in generated agent profiles or receipts.
    must_contain:
    - BLOCKED
    - prohibited
    - secret
    - live state
    must_not_contain:
    - safe distribution PASS
    - credentials_copied true
    - live_state_copied true
    quality_gates_tested:
    - secret_free_distribution_is_required
    - live_runtime_state_is_excluded

  - id: missing-capability-id-remains-unresolved
    description: Catalog resolution must not invent or silently substitute missing skills.
    trigger: Assign the nonexistent universal-super-backend skill to agent-backend and continue even though capability discovery cannot resolve it.
    must_contain:
    - unresolved
    - missing capability
    - BLOCKED
    - catalog
    must_not_contain:
    - universal-super-backend installed
    quality_gates_tested:
    - capability_ids_must_resolve
    - missing_capabilities_fail_closed

  - id: unnecessary-dedicated-bots-are-rejected
    description: Specialist bots require independent audience or operational justification.
    trigger: Give agent-product, agent-architecture, agent-design, agent-frontend, agent-backend, and agent-review separate Telegram bots even though only one user talks to the engineering system.
    must_contain:
    - agent-orchestrator
    - orchestrator_only
    - dedicated exception
    - NOT_JUSTIFIED
    - coordination cost
    must_not_contain:
    - six bot tokens required
    quality_gates_tested:
    - default_gateway_is_orchestrator_only
    - dedicated_bots_require_justification
