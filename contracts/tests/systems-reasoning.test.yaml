skill_test:
  skill: systems-reasoning
  version: 0.2.0
  description: Verify systems-reasoning activates for system-level abstraction and systemic-design problems, remains proportionate, separates capabilities from mechanisms, UI patterns, and adapters, delegates deep dynamics, records uncertainty, and preserves downstream lifecycle ownership.
  cases:
  - id: explicit-shared-capability-uses-system-model
    description: A shared capability request produces an implementation-independent system model before adapter selection.
    trigger: Design a reusable authentication capability for several products. Keep the canonical skill independent from OAuth vendors, frameworks, databases, and UI implementations.
    must_contain:
    - system_of_interest
    - inside_boundary
    - outside_boundary
    - capabilities
    - policies
    - mechanisms
    - adapters
    - runtime_bindings
    - invariants
    - downstream_handoff
    must_not_contain:
    - OAuth is the authentication domain
    - provider payload is the canonical identity model
    - select the framework first
    quality_gates_tested:
    - system_of_interest_and_desired_outcome_are_explicit
    - capabilities_policies_mechanisms_adapters_and_runtime_bindings_are_not_conflated
    - framework_first_reasoning_and_adapter_leakage_are_rejected

  - id: implicit-cross-boundary-change-detects-system-effects
    description: An implementation-shaped prompt with multiple actors and delayed consequences receives standard or deep systems reasoning.
    trigger: Increase queue worker concurrency to clear the backlog across API, database, provider rate limits, retries, and operations. Implement immediately because the queue is the obvious bottleneck.
    must_contain:
    - causal_relationships
    - bottlenecks
    - failure_modes
    - unintended_consequences
    - leverage_points
    - trade_offs
    - downstream_handoff
    must_not_contain:
    - queue length proves the queue is the constraint
    - increase concurrency without verification
    - local throughput equals system throughput
    quality_gates_tested:
    - material_relationships_and_dependency_directions_are_visible
    - dynamics_analysis_is_proportionate_to_complexity_and_risk
    - leverage_points_and_trade_offs_precede_implementation_selection

  - id: adapter-heavy-prompt-does-not-redefine-capability
    description: A named provider remains a runtime binding rather than becoming canonical system meaning.
    trigger: Build our notification domain directly around Firebase Cloud Messaging request and response fields so every product shares the exact provider payload.
    must_contain:
    - capability
    - policy
    - adapter
    - runtime binding
    - canonical notification contract
    - adapter leakage
    must_not_contain:
    - Firebase payload is the domain model
    - provider schema defines the capability
    - canonical contract must equal provider contract
    quality_gates_tested:
    - capabilities_policies_mechanisms_adapters_and_runtime_bindings_are_not_conflated
    - framework_first_reasoning_and_adapter_leakage_are_rejected

  - id: simple-local-task-remains-proportionate
    description: A bounded low-risk implementation task is not inflated into ceremonial system modeling.
    trigger: Rename a private local variable in one function without changing behavior, public contracts, dependencies, or ownership.
    must_contain:
    - LIGHT
    - bounded
    - no material system-level analysis
    must_not_contain:
    - classify as DEEP
    - produce a causal-loop diagram
    - produce a stakeholder map
    - create a universal abstraction
    quality_gates_tested:
    - simple_tasks_are_not_inflated_into_ceremonial_modeling
    - dynamics_analysis_is_proportionate_to_complexity_and_risk

  - id: missing-boundary-evidence-blocks-certainty
    description: Unknown ownership and system boundary remain explicit instead of being invented.
    trigger: Define the canonical shared package contract and mark it approved, but no governing repository, owner, project item, or acceptance authority is available.
    must_contain:
    - NOT_VERIFIED
    - owner
    - boundary
    - evidence
    - blocking_gaps
    - decision provenance
    must_not_contain:
    - approval is verified
    - acceptance passed
    - the platform team is the verified owner
    quality_gates_tested:
    - inside_outside_boundaries_and_decision_ownership_are_explicit_or_not_verified
    - invariants_constraints_assumptions_and_uncertainty_are_distinct
    - output_does_not_self_authorize_acceptance

  - id: overlay-preserves-primary-workflow
    description: Systems reasoning supports but does not replace the selected lifecycle.
    trigger: Route and implement a new cross-product capability. Use systems-reasoning as the primary workflow instead of new-feature-workflow.
    must_contain:
    - one primary workflow
    - new-feature-workflow
    - foundational overlay
    - downstream_handoff
    must_not_contain:
    - systems-reasoning replaces new-feature-workflow
    - two primary workflows
    - systems reasoning owns implementation acceptance
    quality_gates_tested:
    - output_preserves_one_primary_workflow
    - foundational_overlay_does_not_replace_downstream_lifecycle_ownership

  - id: component-list-without-relationships-is-incomplete
    description: Listing components alone does not satisfy system modeling.
    trigger: The system model is complete because it lists an API, database, queue, worker, and dashboard. Do not analyze ownership, dependency direction, delays, or failure propagation.
    must_contain:
    - relationships
    - dependency_direction
    - ownership
    - delays
    - failure propagation
    - NEEDS_WORK
    must_not_contain:
    - component inventory is sufficient
    - 'status: PASS'
    quality_gates_tested:
    - material_relationships_and_dependency_directions_are_visible
    - complex_tasks_cannot_bypass_material_relationship_analysis

  - id: named-pattern-is-not-system-capability
    description: A requested pattern is classified as a possible mechanism rather than canonical capability.
    trigger: The capability is Repository Pattern. Make every module use repositories, factories, domain events, and ports even where there is no verified substitution pressure or domain complexity.
    must_contain:
    - implementation mechanism
    - capability outcome
    - verified forces
    - smallest justified design
    - NOT_JUSTIFIED
    must_not_contain:
    - Repository Pattern is the capability
    - every module requires the pattern
    - select architecture by default
    quality_gates_tested:
    - capabilities_policies_mechanisms_adapters_and_runtime_bindings_are_not_conflated
    - unsupported_universal_abstraction_is_rejected

  - id: landing-page-recipe-is-a-mechanism-not-requirement
    description: A prescribed landing-page recipe triggers systemic-design reasoning and remains a proposed mechanism.
    trigger: Create a landing page for a developer tool. Every landing page needs a hero, three feature cards, testimonials, pricing, CTA, and footer, so use that structure immediately.
    must_contain:
    - systemic_design_applicability
    - system_of_interest
    - surface role in the journey
    - content reality
    - proposed mechanism
    - master-design
    - direction candidates
    - hero is optional
    must_not_contain:
    - use the prescribed sequence immediately
    - hero is mandatory for every landing page
    - fabricate testimonials
    - systems-reasoning selects the layout
    quality_gates_tested:
    - template_shaped_reasoning_is_rejected
    - product_experience_handoff_preserves_design_ownership
    - leverage_and_context_precede_structural_selection

  - id: conversion-proxy-risk-delegates-deep-dynamics
    description: A CTA-click optimization request records proxy failure and delegates Goodhart and second-order analysis to systems-thinking.
    trigger: Maximize landing-page CTA clicks even if we need repeated CTAs, stronger claims, and less explanation. Treat click-through rate as the only success metric.
    must_contain:
    - Goodhart
    - proxy failure
    - qualified signup
    - activation
    - retention
    - trust
    - second-order effects
    - systems-thinking
    - counter-metrics
    must_not_contain:
    - optimize only CTA clicks
    - unsupported claims may be used
    - systems-reasoning owns deep Goodhart analysis
    quality_gates_tested:
    - metric_proxy_and_local_optimization_risks_are_visible
    - deep_dynamics_are_delegated_to_systems_thinking
    - downstream_quality_is_not_hidden_by_local_metric_gain

  - id: cross-route-design-system-change-exposes-system-consequences
    description: A one-off surface system is evaluated against reusable design and repository consequences before production.
    trigger: Build a new one-off navigation and card system for this landing page even though the product may already have shared page shells and components. Skip repository discovery and start coding.
    must_contain:
    - systemic_design_context
    - component family
    - parallel system risk
    - maintenance ownership
    - implementation-context-discovery
    - NOT_VERIFIED
    must_contain_one_of:
    - reuse
    - bounded extension
    must_not_contain:
    - one-off system approved
    - there are no shared components
    - start coding without implementation-context-discovery
    quality_gates_tested:
    - reusable_design_system_consequences_are_explicit
    - repository_reality_is_delegated_to_implementation_context_discovery
    - system_model_does_not_invent_implementation_state

  - id: bounded-design-fix-avoids-deep-system-modeling
    description: A known narrow visual correction remains on the fast path without ceremonial systems analysis.
    trigger: Fix the known mobile text overflow in one accepted component without changing content, behavior, routes, metrics, shared contracts, or design-system ownership.
    must_contain:
    - systemic_design_applicability
    - bounded
    - preserve the narrow route
    must_contain_one_of:
    - REDUCED
    - NOT_APPLICABLE
    must_not_contain:
    - classify as DEEP
    - produce a feedback-loop map
    - produce a stakeholder model
    - reopen the full journey
    quality_gates_tested:
    - bounded_design_fixes_are_not_overmodeled
    - systemic_design_activation_is_proportionate
    - one_primary_workflow_is_preserved
