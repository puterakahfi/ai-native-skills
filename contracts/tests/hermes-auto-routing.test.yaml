skill_test:
  skill: hermes-agent-fleet-bootstrap
  version: 0.2.0
  description: >
    Verify the auto-routing contract and evidence receipts (Slice 1 of Epic #304).
    Ensures STAR topology, coordination-first classification gate, structured
    receipts, layered status vocabulary, and durable-vs-temporary dispatch mode
    invariants are honoured.
  cases:

  - id: redesign-happy-path-produces-full-receipt-chain
    description: >
      A redesign request delegates to design + frontend + review workers, each
      review verifies independence, synthesis promotes claims backed by durable
      workers, and origin return matches the desktop origin.
    trigger: Route a homepage redesign request from the desktop chat and produce evidence receipts through delivery.
    must_contain:
      - task_routing_plan
      - agent-design
      - agent-frontend
      - agent-review
      - durable_worker
      - VERIFIED
      - synthesis_receipt
      - origin_return_receipt
      - delivered
    must_not_contain:
      - temporary_delegation
      - NOT_VERIFIED
      - blocked
    quality_gates_tested:
      - exactly_one_primary_workflow
      - one_accountable_owner_per_worker
      - reviewer_independence_verified
      - dispatch_mode_recorded_with_proof
      - origin_channel_matches_return

  - id: backend-bug-merges-with-external-pointer
    description: >
      A bugfix delegates to backend + review, synthesis asserts merged with a
      resolvable PR pointer backed by durable_worker lineage.
    trigger: Route a backend bug fix from Telegram gateway and promote merged claim.
    must_contain:
      - agent-backend
      - agent-review
      - durable_worker
      - merged
      - external_pointer
      - gateway_telegram
    must_not_contain:
      - temporary_delegation
      - NOT_VERIFIED
    quality_gates_tested:
      - external_claim_requires_pointer
      - external_claim_requires_durable_lineage

  - id: orchestrator-self-handles-acknowledgment
    description: >
      A pure acknowledgment produces an orchestrator_action_receipt with
      category=acknowledgment and no worker dispatch.
    trigger: User sends 'thanks' — orchestrator self-handles without delegation.
    must_contain:
      - self_handled
      - acknowledgment
      - orchestrator_action_receipt
    must_not_contain:
      - dispatch_receipt
      - worker_receipt
      - review_receipt
    quality_gates_tested:
      - self_handle_category_in_allow_list
      - self_handle_requires_justification

  - id: orchestrator-self-handles-read-only-lookup
    description: >
      A read-only lookup for a known workspace file is self-handled with
      category=read_only_lookup.
    trigger: User asks 'where is .env.local for ATF' — orchestrator returns the path.
    must_contain:
      - self_handled
      - read_only_lookup
      - orchestrator_action_receipt
    must_not_contain:
      - dispatch_receipt
      - worker_receipt
    quality_gates_tested:
      - self_handle_category_in_allow_list

  - id: orchestrator-shortcut-implementation-is-blocked
    description: >
      An implementation request self-handled by orchestrator is rejected because
      'implementation' is not in the self-handle allow-list.
    trigger: Orchestrator emits a component itself instead of delegating to agent-frontend.
    must_contain:
      - blocked
      - self_handled_out_of_scope
    must_not_contain:
      - approved
      - delivered
    quality_gates_tested:
      - self_handle_category_in_allow_list
      - domain_work_requires_delegation

  - id: temporary-delegation-cannot-promote-external-claim
    description: >
      Synthesis that promotes merged claim backed by temporary_delegation
      dispatch is rejected under §5 + §7.4.
    trigger: A delegate_task subagent completes a bugfix; orchestrator tries to synthesize merged=true.
    must_contain:
      - temporary_delegation
      - blocked
    must_not_contain:
      - merged=asserted
    quality_gates_tested:
      - external_claim_requires_durable_lineage
      - temporary_delegation_cannot_own_external_claim

  - id: reviewer-independence-not-verified-cannot-approve
    description: >
      A reviewer whose independence is NOT_VERIFIED (shared_profile with worker)
      cannot record verdict=approved.
    trigger: Reviewer profile equals worker profile and reports NOT_VERIFIED.
    must_contain:
      - shared_profile
      - NOT_VERIFIED
      - blocked
    must_not_contain:
      - approved
    quality_gates_tested:
      - reviewer_independence_required_for_approval

  - id: worker-receipt-without-evidence-is-rejected
    description: >
      A worker_receipt lacking both receipt_uri and receipt_inline is
      structurally invalid.
    trigger: Worker reports executed but neither receipt_uri nor receipt_inline is supplied.
    must_contain:
      - not_verified
      - missing_evidence
    must_not_contain:
      - approved
      - delivered
    quality_gates_tested:
      - worker_evidence_pointer_required
