# Positive fixture — redesign UI happy path
# Illustrates: STAR topology, 3 specialist workers, 3 independent reviews,
# synthesis promoting internal claims + delivered (external via desktop artifact).

plan:
  schema_version: "1.0"
  plan_id: plan-redesign-homepage-001
  created_at: "2026-07-31T10:00:00Z"
  origin:
    channel: desktop
    session_id: sess-abc-123
    thread_id: thread-42
    user_ref: kahfi
  orchestrator_action:
    kind: delegated_to_specialist
  primary_workflow: redesign-workflow
  workers:
    - worker_id: worker-design-01
      profile: agent-design
      responsibility: Produce dark-mode style guide and component variants aligned with Vercel/Linear reference systems.
      inputs: ["current-homepage-screenshots", "brand-tokens.json"]
      expected_outputs: ["design-tokens.dark.json", "component-inventory.md"]
    - worker_id: worker-frontend-01
      profile: agent-frontend
      responsibility: Implement React components from design tokens.
      depends_on: ["worker-design-01"]
      inputs: ["design-tokens.dark.json", "component-inventory.md"]
      expected_outputs: ["src/components/homepage/*.tsx"]
    - worker_id: worker-review-quality-01
      profile: agent-review
      responsibility: Verify implementation matches design intent, meets accessibility AA, hits Core Web Vitals.
      depends_on: ["worker-frontend-01"]
      inputs: ["design-tokens.dark.json", "src/components/homepage/*.tsx"]
      expected_outputs: ["review-report.md"]
  reviewers:
    - reviewer_id: reviewer-design-fidelity
      profile: agent-orchestrator
      scope: ["design-fidelity", "token-adherence"]
      independence_target: VERIFIED
      reviews_worker_ids: ["worker-design-01"]
    - reviewer_id: reviewer-frontend-quality
      profile: agent-review
      scope: ["accessibility", "web-performance", "type-safety"]
      independence_target: LIMITED
      reviews_worker_ids: ["worker-frontend-01"]
    - reviewer_id: reviewer-report-verifier
      profile: agent-orchestrator
      scope: ["report-completeness"]
      independence_target: VERIFIED
      reviews_worker_ids: ["worker-review-quality-01"]
  review_policy:
    allow_limited_independence: false
    require_reviewer_per_worker: true
  status: delivered

