    assessments: []
    overall_status: VERIFIED | LIMITED_SHARED_MODEL | LIMITED_SHARED_CONTEXT | LIMITED_SHARED_TOOLS | NOT_VERIFIED

  security:
    secret_free_distribution: PASS | FAIL | NOT_VERIFIED
