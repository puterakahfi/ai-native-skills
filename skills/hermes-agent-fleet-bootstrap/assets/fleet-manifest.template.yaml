    human_approval_points: []

  profile_bootstrap_handoffs: []
  migration_plan_ref: ""

  verification:
    checks: []
    blockers: []
    warnings: []
    runtime_assumptions: []
    runtime_evidence: []
    deterministic_input_hash: ""

  readiness:
    verdict: READY | READY_WITH_LIMITATIONS | NEEDS_WORK | BLOCKED | NOT_VERIFIED
    rationale: []
    limitations: []
    next_action: ""

  authority:
    product_approval: VERIFIED | ROUTE_FOR_APPROVAL | NOT_VERIFIED
    profile_write_authorization: VERIFIED | NOT_VERIFIED
