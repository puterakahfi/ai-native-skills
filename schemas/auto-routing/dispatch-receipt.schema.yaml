$schema: http://json-schema.org/draft-07/schema#
$id: https://ai-native-skills/schemas/auto-routing/dispatch-receipt.schema.yaml
title: DispatchReceipt
description: >
  Evidence that the orchestrator dispatched a plan worker to an executor.
  Distinguishes durable specialist profile dispatch from temporary delegate_task.
type: object
additionalProperties: false
required:
  - schema_version
  - receipt_id
  - plan_id
  - worker_id
  - dispatch_mode
  - dispatched_at
  - status
properties:
  schema_version:
    type: string
    const: "1.0"
  receipt_id:
    type: string
    pattern: "^dispatch-[A-Za-z0-9_-]+$"
  plan_id:
    type: string
    pattern: "^plan-[A-Za-z0-9_-]+$"
  worker_id:
    type: string
    pattern: "^worker-[A-Za-z0-9_-]+$"
  dispatched_at:
    type: string
    format: date-time
  status:
    type: string
    enum: [attempted, dispatched, blocked, cancelled, not_verified]
  dispatch_mode:
    type: object
    additionalProperties: false
    required: [kind, proof]
    properties:
      kind:
        type: string
        enum: [durable_worker, temporary_delegation]
      proof:
        type: object
        additionalProperties: false
        properties:
          profile_id:
            type: string
            pattern: "^agent-[a-z][a-z0-9-]*$"
          worker_session_id: { type: string }
          kanban_card_uri: { type: string }
          delegate_task_id: { type: string }
          parent_session_id: { type: string }
          max_turns: { type: integer, minimum: 1 }
    oneOf:
      - description: Durable-worker proof shape
        properties:
          kind: { const: durable_worker }
          proof:
            required: [profile_id, worker_session_id]
      - description: Temporary-delegation proof shape
        properties:
          kind: { const: temporary_delegation }
          proof:
            required: [delegate_task_id, parent_session_id]
